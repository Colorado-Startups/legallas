[[item]]
id = "financing.edgar-access"
title = "EDGAR access: Form ID and account administrators"
category = "financing"
relationship = "company-and-investors"
stage = "first-financing"
repeats = "Every year, an account administrator confirms the account on EDGAR by the end of the quarter the company picks (Rule 10(d)(4))."
deadline = "Well in advance of the first Form D (Rule 10, note 1). SEC staff take an average of two business days to review a Form ID, per its Form ID guide."
note = "The person who submits Form ID first gets Login.gov credentials, using the email on Form ID. Form ID names two account administrators, or one for an individual or a single-member company (Rule 10(d)(2)). A notarized authenticating document goes with it as a PDF, and the notary can't be an account administrator. A missed yearly confirmation has a three-month grace period; after it, EDGAR deactivates the account and a new Form ID is needed."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Form D is filed on EDGAR, and access takes a notarized Form ID and SEC staff review, so it has to start before the 15-day clock."
provided_by = ["founder", "lawyer"]
room_roles = ["counsel"]
evidence = "The SEC's acceptance of Form ID, the named account administrators, the notarized authenticating document kept on file, and each year's confirmation."
sources = [
