[[item]]
id = "intellectual-property.trademark-registration"
title = "Federal trademark application or registration"
category = "intellectual-property"
relationship = "ip-and-assets"
stage = "formation"
repeats = "Declaration of use \"Between the fifth and sixth years after the registration date\"; declaration and renewal \"Between the ninth and 10th years after the registration date\", then every 10 years. \"There is a six-month grace period after each of the above deadlines\" (USPTO, read 2026-11-07)."
deadline = "15 U.S.C. 1051(d)(1): the statement of use is due \"within six months after the date on which the notice of allowance\" is issued; (d)(2) allows an extension for \"one additional 6-month period\". 15 U.S.C. 1058(a): the declaration is due \"Within the 1-year period immediately preceding the expiration of 6 years following the date of registration\", and again within the year before 10 years. The USPTO's pages, read 2026-11-07: claim use \"Within six months of the Notice of Allowance (NOA) issue date\" or within a granted extension; an office action response is due \"within three months of the date specified in the heading of the email notice\"."
applies_when = "When the company has a name or logo it plans to keep."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "A federal registration gives nationwide priority and makes the brand easier to defend."
provided_by = ["lawyer"]
room_roles = ["counsel", "investors"]
evidence = "USPTO filing receipt or registration certificate in the company's name."
sources = [
  { title = "USPTO: trademark basics", url = "https://www.uspto.gov/trademarks/basics" },
  { title = "USPTO: keeping your registration alive", url = "https://www.uspto.gov/trademarks/maintain/keeping-your-registration-alive" },
  { title = "Lanham Act section 1(d), 15 U.S.C. 1051(d)", url = "https://uscode.house.gov/us/usc/t15/s1051/" },
