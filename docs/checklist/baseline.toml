[[item]]
id = "formation.responsible-party-change"
title = "Form 8822-B for a new responsible party"
category = "formation"
relationship = "company-and-state"
stage = "formation"
deadline = "Within 60 days of the change."
applies_when = "When the person the IRS has as the company's responsible party changes, such as a founder leaving."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "The IRS requires a new responsible party to be reported within 60 days, so its notices reach someone who runs the company."
provided_by = ["founder", "accountant"]
room_roles = ["counsel"]
evidence = "Filed Form 8822-B."
sources = [
  { title = "IRS: about Form 8822-B, change of address or responsible party", url = "https://www.irs.gov/forms-pubs/about-form-8822-b" },
]


[[item]]
id = "formation.tax-classification-election"
title = "Tax classification or S corporation election"
category = "formation"
relationship = "company-and-state"
stage = "formation"
deadline = "Form 8832 can take effect no more than 75 days before it is filed, and no later than 12 months after. Form 2553 is due no more than 2 months and 15 days after the start of the tax year it is to take effect."
applies_when = "Only if the company chooses a tax treatment other than its default."
entity_types = ["colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Changes how the company is taxed; S corporation status limits owners and share classes, which venture funds usually cannot fit."
provided_by = ["accountant"]
room_roles = ["counsel", "investors"]
evidence = "Filed Form 8832 or Form 2553, and the IRS acceptance letter."
templates = [
  "founders/tax-classification-election.md",
]
sources = [
  { title = "IRS: about Form 8832, entity classification election", url = "https://www.irs.gov/forms-pubs/about-form-8832" },
  { title = "IRS: about Form 2553, election by a small business corporation", url = "https://www.irs.gov/forms-pubs/about-form-2553" },
  { title = "IRS: instructions for Form 2553", url = "https://www.irs.gov/instructions/i2553" },
  { title = "IRS: Form 8832 and its instructions", url = "https://www.irs.gov/pub/irs-pdf/f8832.pdf" },
]

[[item]]
id = "formation.foreign-qualification"
title = "Authority to do business in each other state where it operates"
category = "formation"
relationship = "company-and-state"
stage = "formation"
applies_when = "When the company does business outside its state of formation, such as a Delaware corporation working in Colorado."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "A company formed elsewhere must get authority before doing business in Colorado. Until it does, it can't sue in a Colorado court to collect its debts, owes up to $100 for each year without authority, and can face a civil penalty of up to $5,000."
provided_by = ["lawyer", "registered-agent"]
room_roles = ["counsel", "investors"]
evidence = "Filed statement of foreign entity authority (Colorado) or the other state's equivalent."
note = "Colorado Secretary of State fee schedule, revised July 1, 2024: \"Foreign Entity Authority Statement\" $100.00."
templates = [
  "founders/foreign-qualification.md",
]
sources = [
  { title = "Colorado Revised Statutes sections 7-90-801 and 7-90-802 (title 7, 2026)", url = "https://olls.info/crs/crs2026-title-07.pdf" },
  { title = "Colorado Secretary of State: foreign entities FAQ", url = "https://www.coloradosos.gov/pubs/business/FAQs/foreigns.html" },
  { title = "Colorado Secretary of State: business organizations fee schedule, revised July 1, 2024", url = "https://www.sos.state.co.us/pubs/info_center/fees/business.html" },
]

