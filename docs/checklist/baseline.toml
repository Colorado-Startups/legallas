[[item]]
id = "compliance-and-governance.tax-returns"
title = "Federal and state income tax returns"
category = "compliance-and-governance"
relationship = "company-and-state"
stage = "ongoing"
repeats = "Every year."
deadline = "Form 1120 by the 15th day of the 4th month after the tax year ends; Form 1065 or 1120-S by the 15th day of the 3rd month. Form 7004 gives an automatic extension of time to file. It doesn't extend the time to pay. The IRS, read 2026-11-07: a corporation's estimated tax \"Installment payments are due by the 15th day of the 4th, 6th, 9th, and 12th months of the corporation's tax year\" (Publication 542). Partners and S corporation shareholders \"generally have to make estimated tax payments if they expect to owe tax of $1,000 or more\" (estimated taxes). A qualified small business can apply part of its research credit to payroll tax; the election \"must be made on or before the due date of the originally filed income tax return (including extensions)\" (Form 6765 instructions)."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "A corporation files Form 1120 and a multi-member LLC files Form 1065 with K-1s, with state returns alongside. Colorado, read 2026-11-07: a C corporation files its return \"on or before the fifteenth day of the fifth month following the close of the taxable year\" (C.R.S. 39-22-608(2)(b)) and pays estimated tax in \"four required installments for each taxable year\" (C.R.S. 39-22-606(4)(a)). Separately, the county assessor sends a personal property schedule, which the company signs and returns \"no later than the April 15 next following\" the assessment date (C.R.S. 39-5-108); personal property on a single schedule worth no more than a set amount is exempt (C.R.S. 39-3-119.5)."
provided_by = ["accountant"]
room_roles = ["counsel", "investors"]
evidence = "Filed federal and state returns with acceptance confirmations."
sources = [
