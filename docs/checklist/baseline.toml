[[item]]
id = "compliance-and-governance.colorado-sales-tax-license"
title = "Colorado sales tax license"
category = "compliance-and-governance"
relationship = "company-and-state"
stage = "first-financing"
repeats = "Renew every two years."
deadline = "C.R.S. 39-26-103(1)(a): selling at retail without a license is unlawful, and the license is \"in force and effect until December 31 of the year following the year in which it is issued, unless sooner revoked.\" The fee is \"a fee of sixteen dollars\" with \"an additional fifty-dollar deposit\"; the licensee must renew on or before January 1 of the second year following the year in which the license is issued or renewed."
applies_when = "Only if the company sells at retail in Colorado."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "A person must have the license before selling at retail; a retailer with two or more separate places of business in the state needs a license for each. Colorado's economic nexus rule reaches a seller with no place of business in the state. It is doing business there in a calendar year if its Colorado retail sales passed $100,000 the year before, or \"On and after the first day of the month after the ninetieth day after\" its sales in the current year \"exceed one hundred thousand dollars\" (C.R.S. 39-26-102(3)(c)(I), read 2026-11-07)."
provided_by = ["founder", "accountant"]
room_roles = []
evidence = "The license issued by the Department of Revenue, with its expiry date."
sources = [
  { title = "Colorado Revised Statutes sections 39-26-102 and 39-26-103 (title 39, 2026)", url = "https://olls.info/crs/crs2026-title-39.pdf" },
]

