[[item]]
id = "founders.section-83b-election"
title = "Section 83(b) election with proof of timely filing"
category = "founders"
relationship = "founders-and-company"
stage = "formation"
deadline = "Within 30 days after the transfer of the shares or units; it cannot be extended. A last day on a weekend or legal holiday moves to the next business day."
applies_when = "When founder stock or capital interests are subject to vesting. A profits interest under Revenue Procedure 2001-43 need not file."
due = { kind = "after", from = ["founders.stock-purchase-agreement"], days = 30, pick = "each", what = "the transfer date on the stock or unit agreement" }
note = "This cannot be fixed later. The founder signs under penalties of perjury; filing early and keeping the confirmation or proof of mailing are common practice."
date_label = "Date filed"
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Without it, tax on restricted stock is generally worked out as it vests; with it, at the transfer. A missed deadline cannot be fixed."
provided_by = ["founder", "accountant", "lawyer"]
room_roles = ["counsel", "investors"]
evidence = "Signed election (Form 15620 or a letter), the online filing confirmation or proof of mailing, and the copy given to the company."
templates = [
  "founders/section-83b-election.md",
