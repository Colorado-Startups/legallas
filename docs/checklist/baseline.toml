deadline = "C.R.S. 8-4-103 and 8-4-109, 2026, read 2026-11-13. Pay periods run no longer than one calendar month or thirty days, whichever is longer, with pay \"on regular paydays no later than ten days following the close of each pay period\", unless employer and employee agree on another period (8-4-103(1)(a)). On a discharge, earned wages are \"due and payable immediately\" (8-4-109(1)(a)). On a resignation, they are due \"upon the next regular payday\" (8-4-109(1)(b)). Wages not paid \"within fourteen days after a written demand is sent\" bring an automatic penalty: the greater of two times the unpaid amount or $1,000, or if willful three times or $3,000 (8-4-109(3)(b)). The director may waive it in the limited case 8-4-109(3.5) sets out."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Colorado sets its own minimum wage, overtime, breaks, exempt salary levels and final pay rules."
provided_by = ["payroll-provider", "accountant", "founder"]
room_roles = ["counsel"]
evidence = "Each role's pay and exempt or nonexempt status checked against the current COMPS and pay calculation orders."
sources = [
