# Legallas baseline company checklist
#
# You aren't receiving legal advice from a licensed lawyer. No lawyer has reviewed this list.
#
# One [[item]] per document or agreement startups commonly keep. README.md in this folder and web/worker/checklist-baseline.ts
# are generated from this file: run `npm run checklist` in web/ after any change, and a test fails if you don't. Field meanings are in [fields] below; allowed values are in [vocabulary]. An item's text reaches founders as the
# product's own words, so it follows docs/legal/product-notices.md, A1.

schema_version = 1
title = "Legallas baseline company checklist"
notice = "Legallas is an AI agent for legal work, not a lawyer or law firm. Using it creates no attorney-client relationship. AI can be wrong. Have your own lawyer review before you sign, file or rely on anything."
template_notice = "Here's every template we have for this. You choose. We don't pick one for you. We fill in only the answers you give us."
template_licence_notice = "Licence: CC0 1.0, a public-domain dedication by Colorado Startups, LTD. Free to use, change and pass on, with no conditions. Forms from other publishers keep their own licences."
template_card_notice = "Not reviewed by a lawyer. It's a starting point, and it may not fit your facts. Have your own lawyer review before you sign."
status = "You aren't receiving legal advice from a licensed lawyer. No lawyer has reviewed this list. Tax items show the law with its source; have your own tax professional review."
drafted = "2026-10-31"
scope = "United States federal law, Delaware and Colorado; a company whose employees work in Colorado"

[fields]
id = "Stable identifier, <category>.<slug>; never reused"
title = "What the document or agreement is called"
category = "Kind of document (vocabulary.categories)"
relationship = "Who the document is between, as the plan groups the checklist (vocabulary.relationships)"
stage = "When it is usually first needed (vocabulary.stages); a company past that stage still needs it"
repeats = "Optional. When it must be redone or kept current"
deadline = "Optional. A fixed deadline the law or the document sets"
due = "Optional. How the room works out a date: after a matched document's date, yearly, or the Colorado report window"
note = "Optional. One more plain line a reader commonly wants next to the deadline"
date_label = "Optional. What a match's date means for this item, in the words the form uses"
templates = "Optional. Files in templates/founders/ for this item. Title, fit and law date come from each file's own front matter"
applies_when = "Optional. The condition that makes the item apply; without it the item applies to every listed entity type"
entity_types = "Entity types it applies to (vocabulary.entity_types)"
why = "Why it matters, in one line"
provided_by = "Who usually provides it (vocabulary.providers)"
room_roles = "Room roles that need it besides the owner (vocabulary.room_roles); empty means owner only"
evidence = "What a complete copy looks like, for matching and for the signed-or-not check"
title_by_entity = "Optional. The document's name for a given entity type, when it differs from title"
sources = "Public sources, each a title and a URL"

[vocabulary]
categories = [
  "formation",
  "founders",
  "intellectual-property",
  "equity",
  "financing",
  "people",
  "commercial",
  "compliance-and-governance",
]
relationships = [
  "company-and-state",
  "founders-and-company",
  "company-and-investors",
  "company-and-people",
  "customers-vendors-and-partners",
  "ip-and-assets",
  "disputes-and-regulators",
]
stages = ["pre-formation", "formation", "first-hires", "first-financing", "priced-round", "ongoing"]
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
providers = [
  "founder",
  "lawyer",
  "accountant",
  "registered-agent",
  "valuation-firm",
  "insurance-broker",
  "payroll-provider",
]
room_roles = ["counsel", "investors"]

[labels.categories]
formation = "Formation"
founders = "Founders"
intellectual-property = "Intellectual property"
equity = "Equity"
financing = "Financing"
people = "People"
commercial = "Commercial"
compliance-and-governance = "Compliance and governance"

[labels.relationships]
company-and-state = "The company and the state"
founders-and-company = "Founders and the company"
company-and-investors = "The company and its investors"
company-and-people = "The company and its people"
customers-vendors-and-partners = "Customers, vendors and partners"
ip-and-assets = "IP and assets"
disputes-and-regulators = "Disputes and regulators"

[labels.stages]
pre-formation = "Pre-formation"
formation = "Formation"
first-hires = "First hires"
first-financing = "First financing"
priced-round = "Priced round"
ongoing = "Ongoing"

[labels.entity_types]
delaware-c-corporation = "Delaware C corporation"
colorado-llc = "Colorado LLC"
colorado-corporation = "Colorado corporation"
delaware-llc = "Delaware LLC"

[labels.providers]
founder = "Founder"
lawyer = "Lawyer"
accountant = "Accountant"
registered-agent = "Registered agent"
valuation-firm = "Valuation firm"
insurance-broker = "Insurance broker"
payroll-provider = "Payroll provider"

[labels.room_roles]
counsel = "Counsel"
investors = "Investors"

