[[item]]
id = "formation.entity-choice"
title = "Entity type and state decision"
category = "formation"
relationship = "company-and-state"
stage = "pre-formation"
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Sets tax treatment, investor fit and every form that follows; the NVCA model documents assume a Delaware corporation."
provided_by = ["founder", "lawyer", "accountant"]
room_roles = ["counsel"]
evidence = "A short written note of the choice and the reasons, ideally from a lawyer or accountant."
templates = [
  "founders/entity-comparison.md",
  "founders/delaware-llc-comparison.md",
]
sources = [
  { title = "U.S. Small Business Administration: choose a business structure", url = "https://www.sba.gov/counseling/launch-your-business/#business-structure" },
  { title = "IRS: business structures", url = "https://www.irs.gov/businesses/small-businesses-self-employed/business-structures" },
  { title = "NVCA model legal documents", url = "https://nvca.org/model-legal-documents/" },
]

[[item]]
id = "formation.name-availability"
title = "Company name availability check"
category = "formation"
relationship = "company-and-state"
stage = "pre-formation"
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "The state refuses a name too close to one on its register, and a clash can also start a trademark dispute. Delaware lets a founder reserve a name for 120 days, renewable, for $75 (8 Del. C. 102(e))."
provided_by = ["founder"]
room_roles = ["counsel"]
evidence = "Dated search results from each state where the company will form or register."
sources = [
  { title = "Colorado Secretary of State: business database search", url = "https://www.coloradosos.gov/biz/BusinessEntityCriteriaExt.do" },
  { title = "Colorado Secretary of State: names FAQ", url = "https://www.coloradosos.gov/pubs/business/FAQs/entityNames.html" },
  { title = "Delaware Division of Corporations: entity search", url = "https://icis.corp.delaware.gov/ecorp/entitysearch/namesearch.aspx" },
  { title = "Delaware Division of Corporations: how to form a new business entity (name reservation)", url = "https://corp.delaware.gov/howtoform/" },
]

[[item]]
id = "formation.formation-document"
