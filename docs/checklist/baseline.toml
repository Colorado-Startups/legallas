[[item]]
id = "financing.form-d-and-state-notices"
title = "Form D and state notice filings"
category = "financing"
relationship = "company-and-investors"
stage = "first-financing"
repeats = "Every offering, with a yearly amendment while an offering stays open."
deadline = "Form D within 15 days after the first sale; state notices by each state's own deadline."
due = { kind = "after", from = ["financing.safe", "financing.convertible-note", "financing.preferred-stock-purchase-agreement"], days = 15, pick = "first-of-each", what = "the first sale" }
note = "First sale is when the first investor is irrevocably committed, which can be when a SAFE is signed, even before the money arrives. Each offering has its own Form D, and the room can only tell offerings apart by kind of document."
date_label = "Date filed"
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Regulation D offerings file a Form D with the SEC, and Colorado and other states where investors live usually require a notice filing too. In Colorado, a Rule 506 issuer files a notification of exemption \"and pay an exemption fee to be determined and collected pursuant to section 11-51-707\" (C.R.S. 11-51-308(1)(p)). The securities commissioner may confirm that an exemption applies, and \"Any person making such a request shall pay an opinion fee\" (C.R.S. 11-51-705). Both read 2026-11-07."
provided_by = ["lawyer"]
room_roles = ["counsel", "investors"]
evidence = "EDGAR filing confirmation and each state's filing confirmation."
sources = [
