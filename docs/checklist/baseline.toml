stage = "first-hires"
repeats = "Every posting."
deadline = "C.R.S. 8-5-201, 2026, read 2026-11-13. The employer makes reasonable efforts to make each opening known to all employees \"on the same calendar day and prior to the date on which the employer makes a selection decision\" (subsection (1)). Then, \"within thirty calendar days after a candidate who is selected to fill a job opportunity begins working in the position,\" the employer makes reasonable efforts to tell the people who will work with that person regularly the name, the new job title and how to show interest in similar openings (subsection (3))."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
