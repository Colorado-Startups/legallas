[[item]]
id = "intellectual-property.patent-filings"
title = "Patent filings and invention records"
category = "intellectual-property"
relationship = "ip-and-assets"
stage = "first-financing"
deadline = "A provisional application has \"a pendency lasting 12 months from the date the provisional application is filed\", and \"can be filed up to 12 months following an inventor's public disclosure of the invention\" (USPTO, read 2026-11-07). 35 U.S.C. 102(b)(1): \"A disclosure made 1 year or less before the effective filing date of a claimed invention shall not be prior art\" in the cases the statute lists; a disclosure can already cost foreign rights. 35 U.S.C. 41(b): maintenance fees are due at 3, 7 and 11 \"years and 6 months after grant\"; with a \"grace period of 6 months\" after each, and the patent expires at the end of the grace period if the fee is not paid. The USPTO: pay \"without surcharge at 3 to 3.5 years, 7 to 7.5 years, and 11 to 11.5 years after the date of issue\", or with a surcharge in the grace periods (read 2026-11-07)."
applies_when = "Only if the company has inventions it may patent."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "Publishing or selling an invention starts clocks that can bar a patent; a provisional application sets an early filing date."
provided_by = ["lawyer"]
room_roles = ["counsel", "investors"]
evidence = "USPTO filing receipts and the signed inventor assignments."
sources = [
  { title = "USPTO: provisional application for patent", url = "https://www.uspto.gov/patents/basics/apply/provisional-application" },
  { title = "Patent Act section 102, 35 U.S.C. 102", url = "https://uscode.house.gov/us/usc/t35/s102/" },
  { title = "Patent Act section 41(b), 35 U.S.C. 41", url = "https://uscode.house.gov/us/usc/t35/s41/" },
  { title = "USPTO: maintain your patent", url = "https://www.uspto.gov/patents/maintain" },
]


