id = "intellectual-property.patent-assignment-recording"
title = "Patent assignments recorded at the USPTO"
category = "intellectual-property"
relationship = "ip-and-assets"
stage = "first-financing"
deadline = "Within 3 months of the assignment's date, or before a later sale or mortgage of the patent. 35 U.S.C. 261 makes an assignment void against a later buyer or lender who paid without notice \"unless it is recorded in the Patent and Trademark Office within three months from its date or prior to the date of such subsequent purchase or mortgage\" (MPEP 301, read 2026-11-07)."
applies_when = "Only if a patent or patent application was assigned to the company."
entity_types = ["delaware-c-corporation", "colorado-llc", "colorado-corporation", "delaware-llc"]
why = "An unrecorded assignment can lose the patent to a later buyer."
provided_by = ["lawyer"]
room_roles = ["counsel", "investors"]
evidence = "USPTO notice of recordation for each assignment."
sources = [
  { title = "Patent Act section 261, 35 U.S.C. 261", url = "https://uscode.house.gov/us/usc/t35/s261/" },
  { title = "USPTO: MPEP 301, ownership and assignability of patents", url = "https://www.uspto.gov/web/offices/pac/mpep/s301.html" },
]

