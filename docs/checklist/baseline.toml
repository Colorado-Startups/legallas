[[item]]
id = "financing.colorado-crowdfunding"
title = "Colorado crowdfunding: Form CF-1 and disclosure document"
category = "financing"
relationship = "company-and-investors"
stage = "first-financing"
deadline = "Notice 10 days before the offering; a quarterly report within 45 days after each quarter ends."
applies_when = "Only if a Colorado entity raises under the Colorado crowdfunding exemption."
entity_types = ["colorado-llc", "colorado-corporation"]
why = "Colorado lets a company organized there raise up to $1 million in 12 months, or $2 million with audited statements, after a notice, with a disclosure document and escrow. Buyers must be Colorado residents or Colorado entities, a buyer who is not accredited is limited to $5,000 in 12 months, and at least 80 percent of the proceeds must be used in Colorado. The issuer files its notice \"not less than ten days before the commencement of an offering\". A quarterly report goes free to the owners, and posting it on the online intermediary's website counts if it is made available \"within forty-five days after the end of each fiscal quarter\" (C.R.S. 11-51-308.5(3)(a)(IV), (XIII), read 2026-11-07)."
provided_by = ["lawyer", "accountant"]
room_roles = ["counsel"]
evidence = "Filed notice, the disclosure document, the escrow agreement and each quarterly report."
sources = [
  { title = "Colorado Revised Statutes section 11-51-308.5 (title 11, 2026)", url = "https://olls.info/crs/crs2026-title-11.pdf" },
  { title = "Colorado Securities Rules 51-3.20 to 51-3.30, 3 CCR 704-1", url = "https://www.coloradosos.gov/CCR/GenerateRulePdf.do?ruleVersionId=12350&fileName=3%20CCR%20704-1" },
]
