  { title = "Colorado Secretary of State: starting a business FAQ", url = "https://www.coloradosos.gov/pubs/business/FAQs/startBusiness.html" },
  { title = "Colorado Secretary of State: business organizations fee schedule, revised July 1, 2024", url = "https://www.sos.state.co.us/pubs/info_center/fees/business.html" },
  { title = "Delaware Limited Liability Company Act section 18-201", url = "https://delcode.delaware.gov/title6/c018/sc02/index.html" },
]


[[item]]
id = "formation.colorado-articles-clauses"
title = "Written consent and cumulative voting clauses in the Colorado articles"
category = "formation"
relationship = "company-and-state"
stage = "formation"
entity_types = ["colorado-corporation"]
why = "Colorado shareholders act by written consent only unanimously unless the articles allow less, and cumulative voting applies unless the articles opt out."
provided_by = ["lawyer"]
room_roles = ["counsel", "investors"]
evidence = "Filed articles that state the choice on each clause, or a dated note of why a clause was left out."
