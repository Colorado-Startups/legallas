[[unit.on_path]]
path = "startup-forms"
cite = "41(h), 1362(b), 3111(a)-(b), 6072(a)-(b), 6109(a), 6672"
governs = "A qualified small business, under $5,000,000 in gross receipts this year and with none before the 5-year period ending this year, can take up to $250,000 of research credit against payroll tax, plus another $250,000 for years after 2022. An S election made within 2 months and 15 days of the year's start counts for that year. A person who willfully fails to pay over withheld tax owes a penalty equal to it. The employer's own tax is 6.2 percent and 1.45 percent of wages. A calendar-year C corporation files \"on or before the 15th day of April\"; a partnership or S corporation \"on or before the 15th day of March\". A return includes \"such identifying number as may be prescribed\"."

[[unit.on_path]]
path = "startup-raises"
cite = "382, 1202, 351"
governs = "Old losses are limited after an ownership change; the QSBS and tax-free transfer rules us-tax-founder names."

[[unit.on_path]]
path = "angels-invest"
cite = "1045, 1202, 1244"
governs = "Rolling QSBS gain into new QSBS, the exclusion itself, and ordinary loss on failed small business stock."

[[unit.on_path]]
path = "angels-create-groups"
cite = "1061, 1202(g), 6698(a)-(b)"
governs = "A manager's carried interest needs more than 3 years for long-term gain. QSBS gain through a vehicle reaches only members who held their interest when it bought the stock, and since. A partnership return filed late costs, for each month up to 12, \"$195, multiplied by\" the number of partners, raised for inflation under 6698(e)."

[[unit.on_path]]
path = "vcs-invest"
cite = "512, 1061, 1446, 6223, 7704"
governs = "Tax-exempt partners and business income, carried interest, withholding for foreign partners, the partnership representative who binds the fund, and the transfer limits that keep it a partnership."

[[unit.on_path]]
path = "fights"
topic = "Wage claims"
entity = "both"
cite = "409A, 6672"
governs = "Severance that fails 409A, and personal liability for payroll tax a responsible person willfully left unpaid."

[[unit.on_path]]
path = "fights"
topic = "Unpaid tax in a split"
entity = "both"
cite = "6045(f), 6501(a)"
governs = "A business paying an attorney in connection with legal services, for the payor or not, files a return of it. Tax is assessed \"within 3 years after the return was filed\"."

