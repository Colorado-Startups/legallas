official_url = "https://www.ded.uscourts.gov/sites/ded/files/pages/Electronic%20Discovery%20Default%20Standard_0.pdf"
fetch_url = "https://www.ded.uscourts.gov/sites/ded/files/pages/Electronic%20Discovery%20Default%20Standard_0.pdf"
format = "PDF, 167,593 bytes; the Local Rules are a separate PDF"
as_of = "Local Rules amended effective September 1, 2026; Default Standard as posted, opened 2026-11-13"
status = "VERIFIED"
note = "Both read on 2026-11-13. Local Rules: https://www.ded.uscourts.gov/sites/ded/files/2026%20District%20of%20Delaware%20Revised%20Local%20Rules%20Effective%20September%201.pdf. The Default Standard prints no date; its server date is 2019-05-22, so it may be older than a later order. Federal works, cited until a reader for each PDF has been checked on a real copy."

[[unit.on_path]]
path = "fights"
topic = "Federal discovery in Delaware"
entity = "both"
cite = "Default Standard 1(c), 1(d)(ii), 1(d)(iv), 3(a); LR 26.1, 26.2, 30.1, 37.1"
need = "court-rules.d-del-local"
governs = "Absent agreement, each party takes \"reasonable and proportional steps to preserve discoverable information\", and the ESI categories in Schedule A need not be preserved (1(c)). Information made after the complaint is filed stays off privilege logs (1(d)(ii)). Until a Rule 502 order is entered, privileged material \"shall be immediately returned\" if it plainly was produced by mistake or \"if notice is provided within 30 days of inadvertent production\" (1(d)(iv)). Within 30 days after the Rule 16 conference each party names its 10 most likely custodians (3(a)). Responses quote each request in full (LR 26.1). Until a confidentiality agreement is in place, documents marked confidential go only to trial counsel's firm (LR 26.2). Deposition notice \"shall be not less than 10 days\" (LR 30.1). A discovery motion recites the disputed request verbatim (LR 37.1)."

[[unit]]
id = "us-arbitration-act"
title = "Federal Arbitration Act"
citation = "9 U.S.C. 1 to 16, 401, 402"
level = "federal"
layer = "other"
first_path = "startup-forms"
paths = ["startup-forms", "fights"]
take = "whole"
ship = "bundle"
host = "uscode"
official_url = "https://uscode.house.gov/us/usc/t9/"
fetch_url = "https://uscode.house.gov/us/usc/t9/s1/"
format = "HTML, one page per section"
as_of = "U.S. Code through Pub. L. 119-138 (2026-11-03), read 2026-11-13"
status = "PARTIAL"
note = "Chapter 1 (sections 1 to 16) and chapter 4 (401, 402) stored whole. Read in full only at the sections its rows cite: 2, 3, 4, 7, 9, 10, 12 and 402. Chapters 2 and 3, the New York and Panama conventions, are not stored."

[[unit.on_path]]
path = "startup-forms"
cite = "2, 402(a)"
need = "court-rules.arbitration-clause"
governs = "A written arbitration clause in a contract involving commerce \"shall be valid, irrevocable, and enforceable, save upon such grounds as exist at law or in equity for the revocation of any contract or as otherwise provided in chapter 4\" (2). Chapter 4 lets a person alleging sexual harassment or sexual assault elect to take that case to court, whatever a predispute arbitration clause or joint-action waiver says (402(a))."

[[unit.on_path]]
path = "fights"
topic = "Arbitration: enforce, subpoena, vacate"
entity = "both"
cite = "3, 4, 7, 9, 10(a), 12"
need = "court-rules.us-arbitration"
governs = "A federal court stays a suit on an issue referable to arbitration (3), and orders arbitration on a petition with \"Five days' notice in writing\" (4). Arbitrators may summon a witness to bring documents; the district court \"in which such arbitrators, or a majority of them, are sitting may compel the attendance\" (7). A party may apply to confirm \"within one year after the award is made\" (9). Grounds to vacate include an award \"procured by corruption, fraud, or undue means\" (10(a)(1)). Notice of a motion to vacate, modify or correct \"must be served upon the adverse party or his attorney within three months after the award is filed or delivered\" (12)."

