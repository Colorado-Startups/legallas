[[unit.on_path]]
path = "startup-forms"
cite = "8-40-202(2), -203(1)(b)"
need = "employment-law.contractor-test-colorado"
governs = "An employer is any business with \"one or more persons engaged in the same business or employment\". Anyone working for pay is an employee unless free from control and direction, under the contract and in fact, and customarily engaged in an independent business related to the work. A signed document showing the same nine factors creates a rebuttable presumption of a contractor when it says, in larger, bold or underlined type, that the contractor gets no workers' compensation benefits and pays their own income tax. \"All signatures on any such document must be duly notarized.\""

