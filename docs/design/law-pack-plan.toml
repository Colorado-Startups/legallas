[[unit.on_path]]
path = "startup-forms"
cite = "516.2(a), 516.5, 516.6, 795.105(a)-(b), 795.110"
need = "employment-law.contractor-test-federal"
governs = "Each employer keeps payroll records for every covered employee: full name, home address, hours and pay among them. It preserves payroll records \"for at least 3 years\", and time cards and similar records \"for a period of at least 2 years\". Whether a worker is an employee turns on economic dependence, and labeling an employee an independent contractor doesn't change it. Six factors guide a totality-of-the-circumstances analysis: profit or loss from managerial skill, investments, permanence, control, whether the work is integral, and skill and initiative."

