format = "Word, the whole of title 8; each article lists its own sections"
as_of = "C.R.S. 2026; SB 25-144 set the 2026 FAMLI premium; HB 26-1309 amended 8-13.3-503(6)"
status = "VERIFIED"
note = "Read in full in the 2026 file on 2026-11-02: 47 sections with text, 301 to 305 repealed. Source notes: 2025 or 2026 changes touch 8-13.3-301 to -305, the part SB 25-271 repealed, and -503, -505 and -507. The statute calls FAMLI premiums fees, not taxes (8-13.3-507(7)). Opened again on 2026-11-13 in the same file (Last-Modified 2026-10-02): the section count and the 2025 and 2026 source notes match."

[[unit.on_path]]
path = "startup-forms"
cite = "8-13.3-403, -503(8), -507, -511"
governs = "Every employer gives paid sick leave: at least 1 hour for every 30 hours worked, up to 48 hours a year unless it sets more. The 2026 FAMLI premium is 0.88% of wages. Any employer may deduct up to half from wages; one of 10 or more remits all of the premium, one of fewer than 10 remits half. No premium is due on wages above the Social Security wage base, and from 2027 the rate is set by rule, up to 1.2%. FAMLI reaches an employer with at least one person working each working day of 20 or more weeks this year or last, or $1,500 of wages in a quarter last year; it posts the program notice and tells each employee in writing on hiring."

