status = "VERIFIED"
note = "Read in full in the 2026 file on 2026-11-13: 24 sections, 22 with text; 113 and 114 repealed. The statewide minimum wage itself is in Colo. Const. art. XVIII, sec. 15, which this unit doesn't hold. Each year's figures are in the Division's orders: co-comps-order and co-pay-calc-order."

[[unit.on_path]]
path = "startup-forms"
cite = "8-6-101(3), (3.5), (6), -107(2), -111(2), (4), -116, -118"
need = "employment-law.minimum-wage"
governs = "A local government may set a minimum wage above the state's for anyone working four or more hours a week in its bounds. A local increase \"must take effect on the same date as a scheduled increase to the statewide minimum wage\". From July 1, 2025, the local tip offset is \"three dollars and two cents\". Every employer keeps \"a register of the names, ages, dates of employment, and residence addresses of all employees\". A Division wage order \"becomes effective thirty days after it is made\", and may permit overtime at one and one-half times the regular rate. Paying less than the minimum is unlawful, and the employee recovers the unpaid balance with attorney fees and court costs."

