[[unit.on_path]]
path = "startup-forms"
cite = "11-51-201(17), -301, -307(1)(i), -308(1)(i), (j)"
governs = "Founder and staff equity are securities. Exemptions for employee plans, for transactions not involving a public offering, and for up to 20 offerees and 10 buyers in Colorado in 12 months."

[[unit.on_path]]
path = "startup-raises"
cite = "11-51-301, -308(1)(p), -308.5, -401, -501, -604"
governs = "Rule 506 route in Colorado: the 308(1)(p) exemption plus a notice. No rescission liability solely for missing that notice, though enforcement risk remains. Colorado crowdfunding: up to $1 million in 12 months, $2 million with audited financials, $5,000 per non-accredited buyer. A person paid to sell for an issuer can be a sales representative needing a license. Fraud and civil liability."

[[unit.on_path]]
path = "angels-invest"
cite = "11-51-501, -604(3), (4), (8), (9)"
governs = "An angel's fraud claims. Limits: 2 years from the contract for unregistered or unlicensed sales; 3 years from discovery, 5 at most, for fraud. A compliant rescission offer bars suit."

[[unit.on_path]]
path = "angels-create-groups"
cite = "11-51-201(2), (9.5), (14), -401"
governs = "A paid group manager can be a broker-dealer, sales representative or investment adviser under Colorado's definitions. No group exemption exists in statute or rule."

[[unit.on_path]]
path = "vcs-invest"
cite = "11-51-201(5.5), (9.5), (9.6), -401(1.5), (1.6), -402(5)"
governs = "An exempt reporting adviser isn't a federal covered adviser, so Colorado licensing applies unless exempt. HB 26-1188 removed the place-of-business test from adviser licensing and notice filing, though the 402(5) exemption still requires no place of business in Colorado."

[[unit.on_path]]
path = "fights"
topic = "Securities fraud in insider transactions"
entity = "both"
cite = "11-51-501(1), -604(3), (4)"
governs = "Same three-part fraud ban for any offer, sale or purchase. A civil claim against one who recklessly, knowingly or intentionally sells or buys; the lighter claim runs only to buyers, so a founder selling to the company looks to 604(3). Control persons can be liable."

