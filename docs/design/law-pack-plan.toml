# Legallas first law pack plan
#
# Design plan for builders. Not legal advice. No lawyer has reviewed it.
#
# The same law list as docs/design/document-set-and-law.md, which renders its law tables from this file.
# One [[unit]] per whole act or rule set: the pack takes units whole, on their merits, not hand-picked sections.
# Each [[unit.on_path]] says what that unit governs on one path, with the sections that matter most there.
# Field meanings are in [fields]; allowed values are in [vocabulary].

schema_version = 1
title = "Legallas first law pack plan"
status = "Design plan for builders. Not legal advice. No lawyer has reviewed it."
checked = "2026-11-01"
companion = "docs/design/document-set-and-law.md"
scope = "Colorado first, then Delaware and federal law, for startups, angels, angel groups and VC funds"
build_order = ["startup-forms", "startup-raises", "angels-invest", "angels-create-groups", "vcs-invest"]
built_as = "web/scripts/law/default-pack.ts, with its units in default-pack-units.ts under these ids. A test keeps titles, citations and paths equal to this file"
ships = "The list of units and where each comes from. No law text at any level: each install downloads it into its owner's own account, so a ship verdict below only matters if Colorado Startups later wants to ship text itself"

[fields]
id = "Stable identifier; never reused"
title = "The act or rule set's name, as the source gives it"
citation = "Citation for the whole unit"
level = "Colorado, Delaware or federal (vocabulary.levels)"
layer = "agreements or securities, or other where a document depends on it (vocabulary.layers)"
first_path = "The first path in build order that needs this unit. fights means only the founder and investor conflict section needs it so far"
paths = "Every path or section that uses it"
take = "What goes in the pack (vocabulary.take)"
ship = "Whether the text may ship inside the open-source pack (vocabulary.ship)"
host = "Id of the [[host]] it comes from"
official_url = "The page a person opens to read it"
fetch_url = "What a builder fetches"
format = "What comes back"
as_of = "Currency line for this copy, from the source"
status = "VERIFIED: opened on the official host on the checked date. PARTIAL: opened there, but read only at heading or citation level, or only the sections named. SECONDARY: nothing official could be opened. UNVERIFIED: could not be settled. The note says what was read"
note = "Anything a builder must know"
flag = "next: built only when a room sets LEGALLAS_LAW_NEXT=1 (web/scripts/law/default-pack-units.ts NEXT_PACK_UNITS), so a live room builds exactly what it did. Absent: every room built with the defaults holds it"

[fields.on_path]
path = "Path or section"
topic = "Only in the fights section: the question this row answers"
entity = "Only in the fights section: llc, corporation, both or lp"
cite = "The sections that matter on this path"
url = "Pinpoint page, when it differs from official_url"
governs = "What it governs on this path, in plain words, with current numbers"
need = "The law page need this row answers, as <page>.<need id> from quality-speed/pages/<page>/needs.json; deadlines and fees quoted in the law's own words"

[vocabulary]
paths = ["startup-forms", "startup-raises", "angels-invest", "angels-create-groups", "vcs-invest", "fights"]
levels = ["Colorado", "Delaware", "federal"]
layers = ["agreements", "securities", "other"]
take = ["whole", "cite-only", "dated-data"]
ship = ["bundle", "after-statement", "after-permission", "after-counsel", "link", "cite-only"]
fetch = ["yes", "yes-with-rules", "browser-only", "no"]
status = ["VERIFIED", "PARTIAL", "SECONDARY", "UNVERIFIED"]
entity = ["llc", "corporation", "both", "lp"]

[labels.take]
whole = "Store the whole act or rule set"
cite-only = "Cite and link; not stored, because a document only leans on it"
dated-data = "Numbers and fees kept in a dated file, refreshed by a person"

[labels.ship]
bundle = "Federal work (17 U.S.C. 105) or the source allows copying: may ship in the pack, with source and date"
after-statement = "Colorado statutes: ship after Colorado Startups files the publisher's statement under C.R.S. 2-5-118(2), with case annotations stripped"
after-permission = "Do not ship or fetch by machine until the owner agrees in writing or a person downloads it"
after-counsel = "No stated reuse terms; ship only after a lawyer clears it. Until then the customer's own install fetches it"
link = "Show a link only"
cite-only = "Named in documents; not in the pack"

[labels.fetch]
yes = "A plain machine fetch works and nothing on the site forbids it"
yes-with-rules = "Works if the site's published rules are followed"
browser-only = "Refuses machines; a person reads it in a browser"
no = "Terms or a bot check forbid machine fetching"

# ---------------------------------------------------------------------------------------------------------------------
# Hosts: where the law comes from, how to fetch it, and what the site's own terms say
# ---------------------------------------------------------------------------------------------------------------------

[[host]]
id = "govinfo-comps"
name = "govinfo, Compilations of Acts"
owner = "US Government Publishing Office"
pattern = "https://www.govinfo.gov/content/pkg/COMPS-{n}/uslm/COMPS-{n}.xml"
format = "USLM XML, PDF"
fetch = "yes"
rules = "No key or stated rate limit"
terms = "Public documents can generally be reprinted; file headers cite 17 U.S.C. 105. Each compilation says it isn't the official text, so check against the U.S. Code"
terms_url = "https://www.govinfo.gov/about/policies"

[[host]]
id = "uscode"
name = "Office of the Law Revision Counsel, U.S. Code"
owner = "US House of Representatives"
pattern = "https://uscode.house.gov/us/usc/t{title}/s{section}/ ; zips at https://uscode.house.gov/download/releasepoints/us/pl/119/134/xml_usc15@119-134.zip"
format = "HTML per section, USLM XML in a zip"
fetch = "yes"
rules = "Site is in a temporary format: old view.xhtml links return 404, and the newest zips returned 404 on the checked date while release point 119-134 worked. Section pages answered a plain fetch on 2026-11-02, each saying which Public Law it is current through; the robots file disallows one named crawler only. govinfo's yearly edition was 2024 on that date, before P.L. 119-21, so current text comes from here"
terms = "Federal work, 17 U.S.C. 105. Titles that aren't positive law, such as title 15, are prima facie evidence of the law"
terms_url = "https://uscode.house.gov/faq.html"

[[host]]
id = "ecfr-api"
name = "eCFR site and API"
owner = "Office of the Federal Register, with GPO"
pattern = "https://www.ecfr.gov/current/title-{t}/section-{s} for a person reading"
format = "HTML"
fetch = "no"
rules = "Link here, don't fetch. The site's robots file disallows /api/versioner/v1/full/, so the API answers but a pack that follows the file can't use it. HTML pages under /current give machines a bot page. Read the same text from govinfo-ecfr"
terms = "Calls itself authoritative but unofficial; reproduction allowed under 1 CFR 2.6. Federal work"
terms_url = "https://www.ecfr.gov/reader-aids/government-policy-and-ofr-procedures/about-this-site"

[[host]]
id = "govinfo-ecfr"
name = "eCFR bulk data on govinfo"
owner = "US Government Publishing Office, with the Office of the Federal Register"
pattern = "https://www.govinfo.gov/bulkdata/ECFR/title-{t}/ECFR-title{t}.xml"
format = "XML, one file per title (title 17: 17 MB)"
fetch = "yes"
rules = "Published for machines, and the robots file doesn't disallow /bulkdata/. AMDDATE in the file says how current it is. A range request gets the whole file"
terms = "Same text as the eCFR site, so the same terms: unofficial, reproduction allowed under 1 CFR 2.6. Federal work"
terms_url = "https://www.govinfo.gov/bulkdata/ECFR"

[[host]]
id = "govinfo-cfr"
name = "Code of Federal Regulations, annual edition on govinfo"
owner = "US Government Publishing Office, with the Office of the Federal Register"
pattern = "https://www.govinfo.gov/link/cfr/{t}/{part}?sectionnum={s}&year=mostrecent&link-type=xml, which redirects to https://www.govinfo.gov/content/pkg/CFR-{year}-title{t}-vol{n}/xml/CFR-{year}-title{t}-vol{n}-sec{part}-{s}.xml; the PDF sits at the same path under /pdf/"
format = "XML, one file per section; PDF"
fetch = "yes"
rules = "The robots file doesn't disallow /link/ or /content/pkg/. On 2026-11-13, year=mostrecent gave title 26's edition revised as of 2025-04-01, and year=2026 answered 400. DATE in each file names its edition. Amendments after it are not in the text, so compare with eCFR when a rule changed since"
terms = "The annual edition is the official CFR; govinfo's CFR help page says eCFR is not an official legal edition. Federal work"
terms_url = "https://www.govinfo.gov/help/cfr"

[[host]]
id = "govinfo-fr"
name = "Federal Register on govinfo"
owner = "US Government Publishing Office, with the Office of the Federal Register"
pattern = "https://www.govinfo.gov/link/fr/{volume}/{page}; each document's PDF and HTML sit under https://www.govinfo.gov/content/pkg/FR-{date}/"
format = "PDF, HTML"
fetch = "yes"
rules = "The robots file doesn't disallow /link/ or /content/pkg/. No key or stated rate limit"
terms = "govinfo's Federal Register help page: its online edition is the official legal equivalent of the paper and microfiche editions (44 U.S.C. 4101, 1 CFR 5.10). Federal work"
terms_url = "https://www.govinfo.gov/help/fr"

[[host]]
id = "sec"
name = "sec.gov"
owner = "US Securities and Exchange Commission"
pattern = "https://www.sec.gov/files/{form}.pdf and guidance pages"
format = "PDF, HTML"
fetch = "yes-with-rules"
rules = "Declare a user agent with company name and email. No more than 10 requests per second across all machines"
terms = "Public information that may be copied or further distributed; cite the SEC; don't use its seal or logos"
terms_url = "https://www.sec.gov/about/privacy-information"

[[host]]
id = "irs"
name = "irs.gov"
owner = "Internal Revenue Service"
pattern = "https://www.irs.gov/pub/irs-pdf/{form}.pdf"
format = "PDF, HTML"
fetch = "yes-with-rules"
rules = "Declared user agent worked; some pages refuse plain requests and open only in a browser"
terms = "Not subject to copyright and may be freely copied; credit requested; no seal or implied endorsement. A re-rendered form may count as a substitute form under IRS Publication 1167"
terms_url = "https://www.irs.gov/about-irs/use-of-content-from-irsgov"

[[host]]
id = "olls"
name = "Colorado Revised Statutes download, Office of Legislative Legal Services"
owner = "Colorado General Assembly"
pattern = "https://olls.info/crs/crs2026-title-{NN}.{htm,pdf,docx}"
format = "HTML, PDF, Word"
fetch = "yes-with-rules"
rules = "Robots file disallows only /crs-archive/. The 2026 files carry case annotations; strip them. Each article opens with a list of its sections, which is the check that none went missing. The earlier reading that downloads are for personal use wasn't found on the download page as read on 2026-11-01"
terms = "C.R.S. 2-5-118: a publisher using the state's data set files a statement of what it will publish; only the official set may call itself official; annotations need an application, though the Committee on Legal Services suspended its copyright practice on 2016-03-04"
terms_url = "https://leg.colorado.gov/agencies/office-legislative-legal-services/2026-crs-titles-download"

[[host]]
id = "colorado-ccr"
name = "Code of Colorado Regulations"
owner = "Colorado Secretary of State"
pattern = "https://www.coloradosos.gov/CCR/GenerateRulePdf.do?ruleVersionId=12350&fileName=3%20CCR%20704-1"
format = "PDF (official), Word"
fetch = "no"
rules = "The site's terms say it's for natural persons and prohibit robots and data mining; special requests go through an Authorization Request for Automated Data Collection, which may be denied. Robots file names AI training bots and sets use=reference. The version id changes with each new rule version"
terms = "Terms prohibit robots and reproduction without written permission. Copyright in the rules themselves wasn't researched"
terms_url = "https://www.coloradosos.gov/pubs/info_center/terms.html"

[[host]]
id = "colorado-securities"
name = "Colorado Division of Securities"
owner = "Colorado Department of Regulatory Agencies"
pattern = "https://securities.colorado.gov/"
format = "HTML, PDF"
fetch = "browser-only"
rules = "Answers 403 to curl and fetch tools; a browser works. Don't get past the refusal"
terms = "Footer links general notices; no reuse terms found. Fees change by alert: keep them as dated data"
terms_url = "https://www.colorado.gov/general-notices"

[[host]]
id = "colorado-labor"
name = "Colorado Division of Labor Standards and Statistics"
owner = "Colorado Department of Labor and Employment"
pattern = "https://cdle.colorado.gov/"
format = "HTML, PDF"
fetch = "browser-only"
rules = "Fetch tools got 403, and so did a headless browser from a cloud session (2026-11-02) and a plain fetch (2026-11-06); a person's browser works"
terms = "No reuse terms beyond \"© 2026 State of Colorado\" (a person's read, 2026-11-02, #134)"
terms_url = "https://cdle.colorado.gov/"

[[host]]
id = "delcode"
name = "Delaware Code Online"
owner = "Delaware General Assembly"
pattern = "https://delcode.delaware.gov/title{t}/c{ccc}/sc{ss}/index.html ; signed whole title at /title{t}/title{t}.pdf"
format = "HTML per subchapter, signed PDF per whole title (no chapter PDFs)"
fetch = "yes"
rules = "No robots file. Update check: Last-Modified on the title PDF, and diff the Del. Laws history lines. Section anchors can carry a stray space. Chapter pages end without a closing html tag"
terms = "The PDF cover calls it an official version and disclaims warranty. No copyright statement on the Code pages; the Assembly's site footer says all rights reserved. Reuse is a question for a lawyer"
terms_url = "https://delcode.delaware.gov/title8/title8.pdf"

[[host]]
id = "delaware-regs"
name = "Delaware Administrative Code"
owner = "Delaware Registrar of Regulations"
pattern = "https://regulations.delaware.gov/AdminCode/title6/Rules"
format = "Script-built page; JSON and PDF through an undocumented API"
fetch = "browser-only"
rules = "Plain fetches get an empty shell. The API found in /config.json works but is undocumented and may change; prefer a pinned PDF. archive.regulations.delaware.gov is stale, so don't use it"
terms = "No copyright or disclaimer found. Reuse is a question for a lawyer"
terms_url = "https://regulations.delaware.gov/AdminCode/title6/Rules"

[[host]]
id = "delaware-corp"
name = "Delaware Division of Corporations"
owner = "Delaware Department of State"
pattern = "https://corp.delaware.gov/ and https://corpfiles.delaware.gov/"
format = "HTML, PDF forms"
fetch = "yes"
rules = "The fee file's name changes with each revision: read it from /fee/. The entity search and tax login are separate and forbid automated tools"
terms = "Forms are templates and the Division gives no legal advice. Footer copyright, no reuse terms found"
terms_url = "https://corp.delaware.gov/formsentitytype09/"

[[host]]
id = "delaware-courts"
name = "Delaware courts"
owner = "Delaware Judiciary"
pattern = "https://courts.delaware.gov/forms/download.aspx?id={id}"
format = "PDF"
fetch = "yes"
rules = "Robots file disallows a list of named opinion ids and two paths"
terms = "All rights reserved, including any copyright of the State; requests to reproduce go to the State Court Administrator. Fetching isn't barred. Re-read 2026-11-13: unchanged, so its rules and guidelines stay cited"
terms_url = "https://courts.delaware.gov/terms.aspx"

[[host]]
id = "uscourts"
name = "US Courts"
owner = "Administrative Office of the US Courts"
pattern = "https://www.uscourts.gov/forms-rules/current-rules-practice-procedure"
format = "PDF"
fetch = "yes"
rules = "Robots file, read 2026-11-13: disallows only site paths such as /core/, /profiles/, admin, search, login and the court finder; the rules PDFs under /sites/default/files/ are allowed. Old /rules-policies/ addresses redirect to /forms-rules/"
terms = "Federal work, 17 U.S.C. 105. The Privacy and Security Policy, read 2026-11-13, states no reuse terms and no bar on machine reading. It calls the site a restricted government system for official judiciary business and says access may be monitored"
terms_url = "https://www.uscourts.gov/privacy-security-policy"

[[host]]
id = "cod-uscourts"
name = "US District Court for the District of Colorado"
owner = "United States District Court for the District of Colorado"
pattern = "https://www.cod.uscourts.gov/Portals/0/Documents/LocalRules/{file}.pdf"
format = "PDF"
fetch = "yes"
rules = "No robots file: /robots.txt answered 404 on 2026-11-13. The local rules page links the current rules, revised 2026-03-04"
terms = "Federal work, 17 U.S.C. 105. The footer's terms and privacy links, read 2026-11-13, lead to the site's error page, so no terms were found"
terms_url = "https://www.cod.uscourts.gov/CourtOperations/RulesProcedures/LocalRules.aspx"

[[host]]
id = "ded-uscourts"
name = "US District Court for the District of Delaware"
owner = "United States District Court for the District of Delaware"
pattern = "https://www.ded.uscourts.gov/sites/ded/files/{path}.pdf"
format = "PDF"
fetch = "yes-with-rules"
rules = "Robots file, read 2026-11-13: a 10-second crawl delay; it disallows only site paths such as /admin/, /search/ and /user/, so /sites/ded/files/ is allowed"
terms = "Federal work, 17 U.S.C. 105. No terms page was found on 2026-11-13; the footer links the Judiciary Privacy Policy on uscourts.gov"
terms_url = "https://www.ded.uscourts.gov/default-standard-discovery"

[[host]]
id = "colorado-judicial"
name = "Colorado Judicial Branch"
owner = "Colorado Judicial Department"
pattern = "https://www.coloradojudicial.gov/"
format = "PDF"
fetch = "yes"
rules = "Rule changes are posted one by one; no consolidated copy of C.R.C.P. 37 was found. On 2026-11-02 the site answered a cloud address with a ban notice lasting about a day, so ask one request at a time"
terms = "Not reviewed"
terms_url = "https://www.coloradojudicial.gov/"

# ---------------------------------------------------------------------------------------------------------------------
# Units needed first by: startup forms
# ---------------------------------------------------------------------------------------------------------------------

[[unit]]
id = "co-llc-act"
title = "Colorado Limited Liability Company Act"
citation = "C.R.S. 7-80-101 to 7-80-1224"
level = "Colorado"
layer = "agreements"
first_path = "startup-forms"
paths = ["startup-forms", "startup-raises", "angels-invest", "angels-create-groups", "vcs-invest", "fights"]
take = "whole"
ship = "after-statement"
host = "olls"
official_url = "https://olls.info/crs/crs2026-title-07.pdf"
fetch_url = "https://olls.info/crs/crs2026-title-07.docx"
format = "Word, the whole of title 7; each article lists its own sections"
as_of = "C.R.S. 2026, through the 2026 session"
status = "VERIFIED"
note = "Colorado has no series LLC: the word series appears 0 times in Article 80, and the Secretary of State has no series filing. Part 12 (2026) adds artist companies."

[[unit.on_path]]
path = "startup-forms"
cite = "7-80-203, -204, -108, -401, -404"
governs = "Forming an LLC by articles. The operating agreement controls except for listed limits; duties can be restricted or eliminated only if not manifestly unreasonable. Default: majority decides, and every member must agree to amend or go outside the ordinary course."

[[unit.on_path]]
path = "startup-raises"
cite = "7-80-401, -702, -108"
governs = "Admitting an investor to an LLC needs an amended operating agreement; by default every member must agree."

[[unit.on_path]]
path = "angels-invest"
cite = "7-80-108, -408"
governs = "An SPV formed as a Colorado LLC: its operating agreement sets fees, voting and exit; a member keeps inspection rights the agreement can't unreasonably cut."

[[unit.on_path]]
path = "angels-create-groups"
cite = "7-80-105, -108; no series part"
governs = "A group formed as a Colorado LLC. Colorado has no series LLC, so one LLC can't hold deal-by-deal series under Colorado law."

[[unit.on_path]]
path = "vcs-invest"
cite = "7-80-108, -404"
governs = "A general partner or management company formed as a Colorado LLC, or a fund formed as one."

[[unit.on_path]]
path = "fights"
topic = "Removing officers"
entity = "llc"
cite = "7-80-403"
governs = "Officers are designated or removed by a majority of members, or of managers if there are managers. The operating agreement can change this."

[[unit.on_path]]
path = "fights"
topic = "Removing directors or managers"
entity = "llc"
cite = "7-80-401, -402"
governs = "Managers may be designated and removed by a majority of members. Colorado has a default here; Delaware has none."

[[unit.on_path]]
path = "fights"
topic = "Written consent and notice"
entity = "llc"
cite = "7-80-401; 7-80-707 to -711 repealed 2004"
governs = "No statutory procedure for member meetings or written consent. Decisions go by majority; the operating agreement must supply the mechanics."

[[unit.on_path]]
path = "fights"
topic = "Records access"
entity = "llc"
cite = "7-80-408, -108(2)(b)"
governs = "A member may inspect business, tax, member and contribution information for a related purpose, on written demand stating it. The agreement can't unreasonably restrict this."

[[unit.on_path]]
path = "fights"
topic = "Duties and how an agreement can change them"
entity = "llc"
cite = "7-80-404, -108(1)(a), (1.5), (2)"
governs = "Members in a member-managed LLC, and managers, must account for benefits and not deal adversely or compete. Care is limited to no gross negligence, recklessness or intentional misconduct. The agreement may restrict or eliminate duties if not manifestly unreasonable, and may not eliminate good faith and fair dealing. Stricter than Delaware's text."

[[unit.on_path]]
path = "fights"
topic = "Indemnification and advancement"
entity = "llc"
cite = "7-80-104(1)(k), -407"
governs = "The LLC must reimburse and indemnify members and managers for ordinary-course payments and liabilities incurred without breach of duty."

[[unit.on_path]]
path = "fights"
topic = "Deadlock, dissolution and exit"
entity = "llc"
cite = "7-80-810(2), -602, -603"
governs = "Court dissolution if not reasonably practicable to carry on under the agreement. A member may resign at any time by notice, liable if it breaches the agreement, and then keeps only the economic entitlement. Opposite default to Delaware."

[[unit]]
id = "co-bca"
title = "Colorado Business Corporation Act"
citation = "C.R.S. 7-101-101 to 7-117-105"
level = "Colorado"
layer = "agreements"
first_path = "startup-forms"
paths = ["startup-forms", "startup-raises", "fights"]
take = "whole"
ship = "after-statement"
host = "olls"
official_url = "https://olls.info/crs/crs2026-title-07.pdf"
fetch_url = "https://olls.info/crs/crs2026-title-07.docx"
format = "Word, the whole of title 7; each article lists its own sections"
as_of = "C.R.S. 2026; no 2025 or 2026 source notes in articles 101 to 113"
status = "VERIFIED"
note = "Sections the fights rows cite were first read in the 2024 edition; the source-note sweep of the 2026 edition found no change to articles 101 to 113, and only 7-114-302, 7-117-100.3 and 7-117-101 changed after that."

[[unit.on_path]]
path = "startup-forms"
cite = "7-102-102, including (3); 7-106-101, -102; 7-107-104"
governs = "Articles of incorporation. Two defaults to fix at formation: cumulative voting applies unless the articles opt out, and shareholder written consent must be unanimous unless the articles allow less."

[[unit.on_path]]
path = "startup-raises"
cite = "7-106-101, -102, 7-107-302, 7-110"
governs = "Preferred stock terms in the articles, or set by the board if the articles allow. Voting agreements are specifically enforceable. Amending the articles for a round."

[[unit.on_path]]
path = "fights"
topic = "Removing officers"
entity = "corporation"
cite = "7-108-301, -303(4), -304"
governs = "The board may remove any officer at any time, with or without cause, unless bylaws differ. Removal doesn't touch contract rights, and appointment alone creates none."

[[unit.on_path]]
path = "fights"
topic = "Removing directors or managers"
entity = "corporation"
cite = "7-108-108, -109, -106"
governs = "Shareholders may remove with or without cause unless the articles limit it to cause; votes for must exceed votes against; cumulative voting protects a minority director. A court may remove a director for fraud, dishonesty or gross abuse. Boards may be staggered."

[[unit.on_path]]
path = "fights"
topic = "Contested elections and who controls"
entity = "corporation"
cite = "7-107-103, -102(1)(b), 7-114-301, -303, -305"
governs = "A court may order a meeting that wasn't held, and holders of 10% can demand a special meeting. A shareholder may seek dissolution for deadlock or for illegal, oppressive or fraudulent conduct by those in control; the company or other holders may elect to buy the petitioner out. No section like Delaware's 225 was found."

[[unit.on_path]]
path = "fights"
topic = "Written consent and notice"
entity = "corporation"
cite = "7-107-104, 7-108-202, 7-107-106"
governs = "Shareholder action by consent needs everyone unless the articles expressly allow the needed majority; consents must arrive within 60 days. Board consent needs all directors unless bylaws require a meeting. Opposite default to Delaware, so check the articles first."

[[unit.on_path]]
path = "fights"
topic = "Records access"
entity = "corporation"
cite = "7-116-102 to -105"
governs = "Basic records on 5 business days' written demand. Minutes, accounting records and the shareholder list need 3 months' holding or 5%, plus good faith, proper purpose and particularity. Articles and bylaws can't cut this."

[[unit.on_path]]
path = "fights"
topic = "Duties and how an agreement can change them"
entity = "corporation"
cite = "7-108-401, -402, -501, 7-102-102(2)(d), (e)"
governs = "Directors and officers with discretion act in good faith, with care, and in the reasonably believed best interests. Articles may limit director money liability and the duty to offer opportunities. Conflicting interest transactions have their own section."

[[unit.on_path]]
path = "fights"
topic = "Indemnification and advancement"
entity = "corporation"
cite = "7-109-101 to -111"
governs = "Authority to indemnify; mandatory if wholly successful unless the articles limit it; advancement on written affirmation and undertaking; court-ordered indemnification; officers."

[[unit.on_path]]
path = "fights"
topic = "Voting and transfer agreements"
entity = "corporation"
