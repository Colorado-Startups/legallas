[[unit.on_path]]
path = "startup-forms"
cite = "39-22-301(1)(d)(I)(K), 39-26-102(15)(c), 39-22-604"
governs = "Corporate income tax is 4.40% of Colorado net income for years from 2022, unless 39-22-627 lowers it for a year. Software delivered by any means becomes taxable from 2027-01-01. Employers withhold Colorado income tax from wages."

[[unit.on_path]]
path = "startup-raises"
cite = "39-22-532(2), (3)"
governs = "An investor's advanced industry credit for a qualified investment in a qualified small business is what the Colorado office of economic development sets in a tax credit certificate, and no credit is allowed without a copy of it on the return."

[[unit.on_path]]
path = "angels-invest"
cite = "39-22-104(1.7)(c), (2), 39-22-532(3)"
governs = "A resident pays 4.40% of federal taxable income, as Colorado modifies it, for years from 2022, unless 39-22-627 lowers it for a year, so federal choices carry into Colorado. The advanced industry credit needs its certificate attached to the return."

[[unit.on_path]]
path = "angels-create-groups"
cite = "39-22-601(5.5), 39-22-532(7)"
governs = "A partnership active in Colorado files a Colorado return and reports each partner's share. A partnership or S corporation investor may allocate an advanced industry credit among its owners as they agree."

[[unit.on_path]]
path = "vcs-invest"
cite = "39-22-601(5.5), 39-22-342, -343(1)(a), (2)"
governs = "The fund files the same partnership return. Under the SALT Parity Act a partnership or S corporation may elect each year to be an electing pass-through entity, but only in a year when federal law limits individuals' deduction for state taxes."

[[unit.on_path]]
path = "fights"
topic = "Unpaid tax in a split"
entity = "both"
cite = "39-21-116, -116.5"
governs = "Those responsible who willfully fail to pay over a tax owe a 150% penalty (-116.5). Whoever distributes a dissolving company's assets with tax unpaid is personally liable up to the amount distributed (-116(2))."


[[unit.on_path]]
path = "startup-forms"
cite = "39-22-604(3)(a)(I), (4)(a)"
need = "colorado-tax-law.withholding"
governs = "Every employer paying wages \"shall deduct and withhold\" an amount that approximates \"as nearly as possible the income tax due\". The statute sets no deposit schedule in its own words: 39-22-604(4)(a) reads \"Repealed.\""

[[unit.on_path]]
path = "startup-forms"
cite = "39-22-604(6)(a)"
need = "colorado-tax-law.withholding-statements"
governs = "Each employee's annual statement goes to the department \"on or before the date established pursuant to section 6071 of the internal revenue code for filing similar federal statements.\""

[[unit.on_path]]
path = "startup-forms"
cite = "39-22-301(1)(d)(I)(K), 39-22-303.6(2), 39-22-608(2)(b)"
need = "colorado-tax-law.corporate-income-tax"
governs = "A C corporation pays 4.40% of Colorado net income, apportioned under 39-22-303.6, and files \"on or before the fifteenth day of the fifth month following the close of the taxable year.\" HB 26-1295, section 28, repealed only 39-22-303.6(12), a spent report duty, effective August 12, 2026."

[[unit.on_path]]
path = "startup-forms"
cite = "39-22-606(4)(a), (6)(a)(I)"
need = "colorado-tax-law.corporate-estimated-tax"
governs = "A C corporation pays \"four required installments for each taxable year\", due April 15, June 15, September 15 and December 15. No addition applies when the year's tax \"is less than five thousand dollars.\""

[[unit.on_path]]
path = "startup-forms"
cite = "39-22-601(5.5)(a), (c), 39-22-608(2)(a)"
need = "colorado-tax-law.pass-through-return"
governs = "An LLC taxed as a partnership and active in Colorado files a return \"on or before the fifteenth day of the fourth month following the close of the taxable year\", and gives each partner its share \"no later than the due date for the return, including any extensions\"."

[[unit.on_path]]
path = "startup-forms"
cite = "39-22-104(1.7)(c), 39-22-608(2)(a)"
need = "colorado-tax-law.founder-income-tax"
governs = "A resident founder pays \"four and forty one-hundredths percent\" of federal taxable income for years from 2022, unless 39-22-627 lowers it for a year. The return is due \"on or before the fifteenth day of the fourth month following the close of the taxable year.\""

[[unit.on_path]]
path = "startup-forms"
cite = "39-26-103(1)(a), (c)"
need = "colorado-tax-law.sales-tax-license"
governs = "No retail selling \"without first having obtained a license\". The fee is \"a fee of sixteen dollars\", with \"an additional fifty-dollar deposit\". The license lasts \"until December 31 of the year following the year in which it is issued\"."

[[unit.on_path]]
path = "startup-forms"
cite = "39-26-102(3)(c)(I)"
need = "colorado-tax-law.remote-seller"
governs = "A seller with no Colorado location collects tax if last year's Colorado retail sales exceeded $100,000, or \"On and after the first day of the month after the ninetieth day after\" this year's exceed it."

[[unit.on_path]]
path = "startup-forms"
cite = "39-26-102(15)(c)(I), 39-26-713(3)"
need = "colorado-tax-law.software-sales-tax"
governs = "\"Tangible personal property\" includes computer software, delivered \"by any means\", remote access included. HB 26-1223, section 9: this applies to sales \"on or after January 1, 2027.\" Software \"governed by a negotiable license agreement or developed for use by a particular user\" is exempt."

[[unit.on_path]]
path = "startup-forms"
cite = "39-26-202(1)(a), 39-26-204(1)(a)"
need = "colorado-tax-law.use-tax"
governs = "A business owes use tax \"at the rate of three percent\" on purchases no retailer taxed. Once the tax due passes $300, it is paid \"before the twentieth day of the following month\"; under $300 a year, \"before January 20 of the following calendar year.\""

[[unit.on_path]]
path = "startup-forms"
cite = "39-26-104(3)(a), 39-26-105(1)(b), 39-26-105.2"
need = "colorado-tax-law.local-sales-tax"
governs = "A sale not received at the seller's location is sourced \"to the location where receipt by the purchaser occurs\". Every retailer files \"before the twentieth day of each month\" for the month before. HB 26-1295, section 31, repealed 39-26-128, the uniform sales and use tax base, effective August 12, 2026."

[[unit.on_path]]
path = "angels-invest"
cite = "39-22-104(1.7)(c), 39-22-518(2)(a)(I.5)"
need = "colorado-tax-law.angel-capital-gains"
governs = "An angel's gain on startup stock is taxed at the 4.40% rate. For years from 2022 the capital gain subtraction reaches only a taxpayer \"required to file a schedule F\", a farmer."

[[unit.on_path]]
path = "angels-create-groups"
cite = "39-22-601(5.5)(d)(I), (e)"
need = "colorado-tax-law.spv-composite-return"
governs = "An SPV taxed as a partnership \"shall also file a composite return and make a composite payment of tax on behalf of all of its nonresident partners\", unless (5.5)(d)(II) excludes a partner. It is due with the return."

[[unit.on_path]]
path = "vcs-invest"
cite = "39-22-601(5.5)(d)(I), (e), 39-22-608(2)(a)"
need = "colorado-tax-law.fund-composite-return"
governs = "A fund files the same composite return for nonresident partners, due \"on or before the fifteenth day of the fourth month following the close of the taxable year.\""

[[unit.on_path]]
path = "fights"
topic = "Unpaid tax in a split"
entity = "both"
cite = "39-21-116.5(1), 39-21-107(1)"
need = "colorado-tax-law.responsible-person-penalty"
governs = "An officer or member who willfully fails to pay over a tax owes \"a penalty equal to one hundred fifty percent of the total amount of the tax not collected\". Tax is \"assessed within three years after the return was filed\", unless an exception or waiver extends it."
