[[unit.on_path]]
path = "startup-raises"
cite = "1.53(c)(3), (i); 1.78(a)(1)(i), (b), (k)"
need = "intellectual-property-law.provisional-application"
governs = "A provisional \"will become abandoned no later than twelve months after its filing date\". A later application claims its benefit if \"Filed not later than twelve months after the date on which the provisional application was filed\". On petition, the benefit is restored for one filed \"within two months from the expiration\" of that period when the delay \"was unintentional\". These periods \"are not extendable\". Converting the provisional itself measures the patent's term \"from at least the filing date of the provisional application\"."

[[unit.on_path]]
path = "startup-raises"
cite = "1.362(d), (e), (g)"
need = "intellectual-property-law.patent-maintenance"
governs = "Maintenance fees are paid without surcharge from \"3 years through 3 years and 6 months after grant\", then at 7 and 11 years likewise. With the surcharge, a grace period runs \"through the day of the 4th anniversary of the grant\", then the 8th and 12th. Unpaid, the patent expires at the end of the grace period."

[[unit.on_path]]
path = "startup-raises"
cite = "3.11(a), 3.54"
need = "intellectual-property-law.patent-assignment-recording"
governs = "The Office records assignments of applications and patents sent with a completed cover sheet. Recording \"is not a determination by the Office of the validity of the document\". The three-month window is in 35 U.S.C. 261 (us-patent-basics)."

[[unit.on_path]]
path = "angels-invest"
cite = "1.12(a)(1), (b)"
need = "intellectual-property-law.angels-uspto-records"
governs = "Assignment records for patents and published applications, \"including digests and indexes\", \"are open to public inspection\". Otherwise, a pending application's records need written authority from an inventor, the applicant or an assignee, or a bona fide buyer's or licensee's showing."

