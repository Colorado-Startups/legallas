[[unit.on_path]]
path = "fights"
topic = "Privilege waiver and 502(d) orders"
entity = "both"
cite = "Fed. R. Evid. 502(a), (b), (d), (e)"
need = "court-rules.us-privilege-waiver"
governs = "An inadvertent disclosure waives nothing if the holder \"took reasonable steps to prevent disclosure\" and \"promptly took reasonable steps to rectify the error\" (502(b)). A waiver reaches undisclosed material only if intentional, on the same subject, and fair to read together (502(a)). Under a 502(d) order, the disclosure \"is also not a waiver in any other federal or state proceeding\". A party agreement binds only its parties unless a court order takes it in (502(e))."

