official_url = "https://www.ecfr.gov/current/title-17/chapter-II/part-230"
fetch_url = "https://www.govinfo.gov/bulkdata/ECFR/title-17/ECFR-title17.xml"
format = "The part inside the title 17 XML"
as_of = "eCFR as of 2026-10-29"
status = "VERIFIED"
note = "No final rule changed Regulation D or the accredited investor definition from 2025-01-01 to 2026-10-31, apart from a technical amendment. Rule 505 is reserved."

[[unit.on_path]]
path = "startup-forms"
cite = "Rule 701, Rule 144"
url = "https://www.ecfr.gov/current/title-17/section-230.701"
governs = "Compensatory equity by non-reporting issuers. 12-month cap: greatest of $1 million, 15% of total assets, 15% of the class. Extra disclosure above $10 million in 12 months. Shares are restricted. Rule 144 holding period is 1 year for a non-reporting issuer."

[[unit.on_path]]
path = "startup-raises"
cite = "Rules 500 to 508; 148; 241; 152; 144; 147, 147A; 251 to 263; 901 to 905"
url = "https://www.ecfr.gov/current/title-17/section-230.506"
governs = "506(b): no dollar cap, no general solicitation, up to 35 sophisticated non-accredited buyers in 90 days, with 502(b) disclosure to them. 506(c): solicitation allowed, all buyers accredited and verified. 506(d) bad actors; 506(e) disclosure. 504: $10 million, state registration applies. Form D within 15 days of first sale, and Rule 507 can bar later use after an injunction for failing to file. Demo days, testing the waters, integration. Regulation A: $20 million Tier 1, $75 million Tier 2."

[[unit.on_path]]
path = "angels-invest"
cite = "Rules 501(a), 501(e), 506(c)(2), 144"
url = "https://www.ecfr.gov/current/title-17/section-230.501"
governs = "Who is accredited: income over $200,000 or $300,000 jointly in each of 2 years; net worth over $1 million excluding the primary residence; Series 7, 65 or 82 in good standing; insiders; entities. How a 506(c) issuer verifies. How an SPV counts as a purchaser."

[[unit.on_path]]
path = "angels-create-groups"
cite = "Rule 148"
url = "https://www.ecfr.gov/current/title-17/section-230.148"
governs = "Demo days aren't general solicitation if advertising names no offering, the sponsor gives no advice, doesn't negotiate, charges attendees only reasonable administrative fees and takes no pay for introductions or pay that would require broker or adviser registration, the issuer shares only limited facts, and online attendance is limited. An angel investor group means accredited investors with regular meetings and defined processes, not associated or affiliated with brokers, dealers or advisers; what that phrase means for a group with a sidecar manager is unsettled."

[[unit.on_path]]
path = "vcs-invest"
cite = "Rules 501, 503, 506"
url = "https://www.ecfr.gov/current/title-17/section-230.506"
governs = "The fund's own offering: the same exemptions and bad actor rule, reaching the general partner, investment manager and its principals. Form D with a 3(c) box in Item 6."

