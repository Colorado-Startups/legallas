[[unit.on_path]]
path = "startup-forms"
cite = "13-22-206(1), (2)"
need = "court-rules.arbitration-clause"
governs = "An agreement in a record to arbitrate an existing or later controversy \"is valid, enforceable, and irrevocable except on a ground that exists at law or in equity for the revocation of a contract\" (206(1)). The court decides whether an agreement to arbitrate exists and whether a controversy falls under it (206(2))."

[[unit.on_path]]
path = "fights"
topic = "Arbitration: enforce, subpoena, vacate"
entity = "both"
cite = "13-22-217(1)-(3), -223(1)(a), (2)"
need = "court-rules.co-arbitration"
governs = "An arbitrator may issue subpoenas for witnesses and records, enforced like a civil action's (217(1)). The arbitrator may permit a deposition for use at the hearing (217(2)) and \"such discovery as the arbitrator decides is appropriate in the circumstances\" (217(3)). Grounds to vacate include an award \"procured by corruption, fraud, or other undue means\" (223(1)(a)). A motion to vacate is filed \"within ninety-one days after the movant receives notice of the award\"; for corruption, fraud or other undue means, \"within ninety-one days after either the ground is known or by the exercise of reasonable care should have been known by the movant\" (223(2))."

[[unit]]
id = "de-arbitration-act"
title = "Delaware Uniform Arbitration Act"
citation = "10 Del. C. ch. 57"
level = "Delaware"
layer = "other"
first_path = "startup-forms"
paths = ["startup-forms", "fights"]
take = "whole"
ship = "after-counsel"
host = "delcode"
official_url = "https://delcode.delaware.gov/title10/c057/index.html"
fetch_url = "https://delcode.delaware.gov/title10/c057/index.html"
format = "HTML, one page"
as_of = "Enacted as of 2026-10-01, through 85 Del. Laws c. 550, read 2026-11-13"
status = "PARTIAL"
note = "All 25 sections, 5701 to 5725, stored whole. Read in full only at 5701, 5702(a), 5708 and 5714; the newest history line is volume 77. de-rapid-arbitration-act is the opt-in fast track in chapter 58."

[[unit.on_path]]
path = "startup-forms"
cite = "5701, 5702(a)"
need = "court-rules.arbitration-clause"
governs = "A written agreement to arbitrate \"is valid, enforceable and irrevocable, save upon such grounds as exist at law or in equity for the revocation of any contract\" (5701). The Court of Chancery takes jurisdiction under the chapter when the agreement is one \"specifically referencing the Delaware Uniform Arbitration Act\" and the parties want it to apply (5702(a)). The court doesn't weigh the merits of the claim sent to arbitration."

[[unit.on_path]]
path = "fights"
topic = "Arbitration: enforce, subpoena, vacate"
entity = "both"
cite = "5708(a), (b), 5714(a)(1), (b)"
need = "court-rules.de-arbitration"
governs = "Arbitrators may compel witnesses and documents, and an arbitrator or attorney of record may issue subpoenas, enforced like a civil action's (5708(a)). Arbitrators may permit a deposition of a witness who can't be subpoenaed or attend (5708(b)). Grounds to vacate include an award \"procured by corruption, fraud or other undue means\" (5714(a)(1)). The application \"shall be made within 90 days after delivery of a copy of the award to the applicant\"; for corruption, fraud or other undue means, \"within 90 days after such grounds are known or should have been known\" (5714(b))."

