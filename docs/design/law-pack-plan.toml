[[unit.on_path]]
path = "startup-forms"
cite = "8-5-102(2), -201"
governs = "An employer makes reasonable efforts to make every job opening known to all employees on the same day, before a choice is made, and its notice states in good faith the pay or pay range, a general description of benefits, and when applications are expected to close. It then makes reasonable efforts to announce the hire to those who will work with the new person regularly, \"within thirty calendar days after a candidate who is selected to fill a job opportunity begins working in the position\" (8-5-201(3), read 2026-11-13). Through 2029-07-01, an employer only outside Colorado, with under 15 Colorado staff who all work only remotely, need only give notice of remote openings. An employer may not seek or rely on a candidate's pay history, or bar an employee from disclosing their own pay."

