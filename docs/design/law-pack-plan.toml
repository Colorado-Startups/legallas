[[unit.on_path]]
path = "startup-forms"
cite = "5803(a), (c)"
need = "court-rules.arbitration-clause"
governs = "The fast track applies only when the agreement is signed by the parties, at least 1 party is a business entity formed in Delaware or with its principal place of business there, no party is a consumer, Delaware law governs the agreement, and it expressly names the \"Delaware Rapid Arbitration Act\" (5803(a)). Each party waives the right to enjoin the arbitration, to remove it to federal court, and to appeal or challenge the award except under 5809 (5803(c))."

[[unit.on_path]]
path = "fights"
topic = "Arbitration: enforce, subpoena, vacate"
entity = "both"
cite = "5808(b), (c), 5809(a), (b)"
need = "court-rules.de-arbitration"
governs = "Unless the agreement fixes a time, the final award is due \"within 120 days of the arbitrator's acceptance of the arbitrator's appointment\" (5808(b)). The parties may extend it by unanimous written consent, by no more than 60 days in all (5808(c)). A challenge goes to the Delaware Supreme Court (5809(a)), and \"A challenge to a final award must be taken within 15 days of the issuance of the final award\" (5809(b))."

