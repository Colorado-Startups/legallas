[[unit.on_path]]
path = "startup-forms"
cite = "8-2-126(3), -127(2), -129(1), -130, -131(3)(a)"
need = "employment-law.application-limits"
governs = "An employer uses consumer credit information only where it is substantially related to the job. It may not ask for a username or password to an applicant's or employee's personal account. It lets each employee see their own personnel file \"at least annually\" on request. It may not ask about criminal history \"on an initial written or electronic application form\". Since July 1, 2024 it may not ask for \"age, date of birth, or dates of attendance at or date of graduation from an educational institution on an initial employment application\". Under 8-2-130 and -131, a second violation brings \"a civil penalty not to exceed one thousand dollars\", and a third or later one \"not to exceed two thousand five hundred dollars\"."

[[unit]]
id = "co-unemployment-general"
title = "Colorado Employment Security Act: the contractor test and misclassification"
citation = "C.R.S. 8-70-115, 8-72-114"
level = "Colorado"
layer = "other"
first_path = "startup-forms"
paths = ["startup-forms", "fights"]
take = "whole"
ship = "after-statement"
host = "olls"
