[[unit.on_path]]
path = "fights"
topic = "Federal discovery in Colorado"
entity = "both"
cite = "D.C.COLO.LCivR 26.1(a), 30.1, 30.2(a), 30.3(a), 37.1, 45.1"
need = "court-rules.d-colo-local"
governs = "The proposed scheduling order serves as the written Rule 26(f) discovery plan (26.1(a)). Reasonable notice of a deposition \"shall be not less than 14 days\", after a good faith effort to schedule it conveniently (30.1). Discovery a Rule 26(c) or 30(d) motion targets is stayed while it is pending, but a motion to stay all discovery stays nothing unless granted (30.2(a)). Coaching objections and interruptions except to decide on privilege are abusive deposition conduct (30.3(a)). A discovery motion sets out the specific interrogatory, request or response it targets (37.1). Other subpoenas are served \"no later than seven days\" before the date they name (45.1)."

[[unit]]
id = "d-del-local-rules"
title = "District of Delaware Default Standard for Discovery, Including Discovery of Electronically Stored Information, and Local Rules"
citation = "D. Del. Default Standard for Discovery; D. Del. LR 26.1, 26.2, 30.1, 37.1"
level = "federal"
layer = "other"
first_path = "fights"
