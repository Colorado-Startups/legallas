as_of = "Enacted through 2026-10-01; HB 352 effective 2026-08-01; HB 400 raised the annual tax"
status = "VERIFIED"
note = "Annual tax is $400 and $100 per registered series. 85 Del. Laws c. 273, section 45 makes section 23 (the $400 in 6 Del. C. 18-1107(b)) effective 2026-01-01 (read 2026-11-06). Which payment first owes $400 isn't stated. The Division's FAQ says $300 in one answer and $400 in another; the statute says $400."

[[unit.on_path]]
path = "startup-forms"
cite = "18-101(9), 18-201, 18-1101, 18-1107"
url = "https://delcode.delaware.gov/title6/c018/sc02/index.html"
governs = "Certificate of formation; an LLC agreement may be written, oral or implied. Maximum effect to freedom of contract, and duties can be eliminated except the implied covenant. $400 annual tax by June 1."

[[unit.on_path]]
path = "angels-invest"
cite = "18-101(9), 18-305"
url = "https://delcode.delaware.gov/title6/c018/sc03/index.html"
governs = "A single-deal SPV formed as a Delaware LLC: its agreement governs fees, voting and exit; a member has information rights the agreement can shape."

[[unit.on_path]]
path = "angels-create-groups"
cite = "18-215, 18-218, 18-1107"
url = "https://delcode.delaware.gov/title6/c018/sc02/index.html"
governs = "Protected series, set up in the agreement with notice in the certificate and separate records. Registered series, formed by a filed certificate, $110 each and $100 a year. The route for one vehicle with a series per deal."

[[unit.on_path]]
path = "vcs-invest"
cite = "18-201, 18-1101, 18-215"
url = "https://delcode.delaware.gov/title6/c018/sc02/index.html"
governs = "General partner and management company entities, or an LLC fund."

[[unit.on_path]]
path = "fights"
topic = "Removing officers"
entity = "llc"
cite = "18-402, 18-407"
url = "https://delcode.delaware.gov/title6/c018/sc04/index.html"
governs = "No officer statute: titles and removal come only from the LLC agreement."

[[unit.on_path]]
path = "fights"
topic = "Removing directors or managers"
entity = "llc"
cite = "18-402"
url = "https://delcode.delaware.gov/title6/c018/sc04/index.html"
governs = "By default members manage, with more than 50% of profits interests controlling. A manager is chosen and ceases as the agreement provides. No default removal vote, so a silent agreement leaves a gap."

[[unit.on_path]]
path = "fights"
topic = "Contested elections and who controls"
entity = "llc"
cite = "18-110(a), 18-111"
url = "https://delcode.delaware.gov/title6/c018/sc01/index.html"
governs = "Chancery decides the validity of a manager's election or removal, and hears actions to interpret or enforce the LLC agreement."

[[unit.on_path]]
path = "fights"
topic = "Written consent and notice"
entity = "llc"
cite = "18-302(d), 18-404(d)"
url = "https://delcode.delaware.gov/title6/c018/sc03/index.html"
governs = "Unless the agreement differs, members or managers with the needed votes may act with no prior notice, meeting or vote, and no after-the-fact notice duty appears in these subsections."

[[unit.on_path]]
path = "fights"
topic = "Records access"
entity = "llc"
cite = "18-305"
url = "https://delcode.delaware.gov/title6/c018/sc03/index.html"
governs = "A member may get business, tax, member and contribution information for a purpose reasonably related to membership. A manager may withhold certain information."

[[unit.on_path]]
path = "fights"
topic = "Duties and how an agreement can change them"
entity = "llc"
cite = "18-1101(c), (e), 18-1104"
url = "https://delcode.delaware.gov/title6/c018/sc11/index.html"
governs = "The agreement may expand, restrict or eliminate duties and liability, but not the implied covenant, nor liability for a bad faith breach of it. Where the Act is silent, equity's fiduciary rules apply; those are judge-made."

[[unit.on_path]]
path = "fights"
topic = "Indemnification and advancement"
entity = "llc"
cite = "18-108"
url = "https://delcode.delaware.gov/title6/c018/sc01/index.html"
governs = "An LLC may indemnify anyone, subject to the agreement. Nothing on advancement, so the agreement decides."

[[unit.on_path]]
path = "fights"
topic = "Deadlock, dissolution and exit"
entity = "llc"
cite = "18-802, 18-603"
url = "https://delcode.delaware.gov/title6/c018/sc08/index.html"
governs = "Chancery may dissolve when it isn't reasonably practicable to carry on under the agreement. A member may resign only as the agreement allows."

[[unit.on_path]]
path = "fights"
topic = "Forum and governing law"
entity = "llc"
cite = "18-109(d)"
url = "https://delcode.delaware.gov/title6/c018/sc01/index.html"
governs = "Members and managers may consent to jurisdiction or arbitration. A non-manager member may not waive Delaware courts on internal affairs except by agreeing to arbitrate."

