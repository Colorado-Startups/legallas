status = "VERIFIED"
note = "Statute text shows stale dollars, and rules hold the live ones: 4(a)(6) says $1 million against $5 million; 3(b)(2) says $50 million against $75 million. Lead with the rule number. The whole Title 15 zip is the citation check."

[[unit.on_path]]
