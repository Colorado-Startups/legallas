[[unit.on_path]]
path = "startup-forms"
cite = "2.34(a)"
need = "intellectual-property-law.trademark-basis"
governs = "An application \"must include one or more of the following five filing bases\": use in commerce (section 1(a)), intent to use (1(b)), a foreign registration (44(e)), a foreign application's priority (44(d)), or an international registration (66(a)). Intent to use needs a verified \"bona fide intention to use the mark in commerce\"."

[[unit.on_path]]
path = "startup-forms"
cite = "2.88(a)(1), 2.89(a)-(c), (e)"
need = "intellectual-property-law.trademark-statement-of-use"
governs = "An intent-to-use applicant files its statement of use \"within six months after issuance of a notice of allowance\", or within an extension. Further six-month extensions \"may not aggregate more than 24 months total\", and none reaches past \"36 months from the date of issuance of the notice of allowance\"."

[[unit.on_path]]
path = "startup-forms"
cite = "2.62(a)"
need = "intellectual-property-law.trademark-office-action"
governs = "An office action on a section 1 or 44 application is answered within \"Three months from the issue date\", which \"may be extended by three months up to a maximum of six months\" on a timely request and fee."

[[unit.on_path]]
path = "startup-forms"
cite = "2.160(a), 2.182"
need = "intellectual-property-law.trademark-maintenance"
governs = "The section 8 affidavit is due \"on or after the fifth anniversary and no later than the sixth anniversary\" of registration, then \"within the year before the end of every ten-year period\", with \"a grace period of six months\". Renewal is filed \"within one year before the expiration date of the registration, or within the six-month grace period\"."

