cite = "119(e)(1)"
need = "intellectual-property-law.provisional-application"
governs = "A nonprovisional application gets the provisional's filing date if it is filed \"not later than 12 months after the date on which the provisional application was filed\" and refers to the provisional. That period \"may be extended by an additional 2 months if the delay\" was unintentional, under the Director's rules (37 CFR 1.78(b))."

