host = "cod-uscourts"
official_url = "https://www.cod.uscourts.gov/Portals/0/Documents/LocalRules/2025_Final_Local_Rules.pdf"
fetch_url = "https://www.cod.uscourts.gov/Portals/0/Documents/LocalRules/2025_Final_Local_Rules.pdf"
format = "PDF, 751,142 bytes, last modified 2026-03-04"
