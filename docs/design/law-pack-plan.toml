[[unit.on_path]]
path = "startup-forms"
cite = "206(a)(1)(C), 207(a)(1), 211(c), 213(a)(1), 216(b), 218b"
need = "employment-law.federal-wage-and-overtime"
governs = "The federal minimum wage is \"$7.25 an hour\". Work over \"forty hours\" in a workweek is paid at \"one and one-half times the regular rate\". An employer makes, keeps and preserves records of each employee's wages and hours. Bona fide executive, administrative and professional employees are exempt. An employer that underpays owes the unpaid wages or overtime \"and in an additional equal amount as liquidated damages\". It gives each employee written notice of the health insurance Exchange \"at the time of hiring\"."

