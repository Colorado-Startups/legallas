[[unit.on_path]]
path = "startup-forms"
cite = "102, 109, 141, 152, 153, 157, 202, 204, 228"
url = "https://delcode.delaware.gov/title8/c001/sc01/index.html"
governs = "Charter and bylaws, the board, issuing stock and options, transfer restrictions, written consent by the needed majority (on by default), and ratifying defective acts."

[[unit.on_path]]
path = "startup-raises"
cite = "151, 242, 245, 228, 218, 122(18), 145, 102(b)(7), 122(17)"
url = "https://delcode.delaware.gov/title8/c001/sc05/index.html"
governs = "Classes and series of preferred, amending and restating the charter, a class vote on changes to that class, voting agreements, stockholder agreements with approval rights, indemnification, exculpation, and renouncing corporate opportunities."

[[unit.on_path]]
path = "fights"
topic = "Removing officers"
entity = "corporation"
cite = "142"
url = "https://delcode.delaware.gov/title8/c001/sc04/index.html"
governs = "Officers serve as bylaws or the board provide. The section states no removal vote: bylaws and the board decide."

[[unit.on_path]]
path = "fights"
topic = "Removing directors or managers"
entity = "corporation"
cite = "141(k), 141(d), 225(c)"
url = "https://delcode.delaware.gov/title8/c001/sc04/index.html"
governs = "A majority of voting shares may remove any or all directors with or without cause. Classified boards: for cause only unless the charter differs. Cumulative voting protects a minority director. Court removal only after a felony conviction or a prior loyalty judgment."

[[unit.on_path]]
path = "fights"
topic = "Contested elections and who controls"
entity = "corporation"
cite = "225(a), (b), 211(c), (d), 226"
url = "https://delcode.delaware.gov/title8/c001/sc07/index.html"
governs = "Chancery decides the validity of any election, appointment, removal or resignation of a director or officer. It may order a meeting after 30 days past the set date, or 13 months. It may appoint a custodian on deadlock or abandonment."

[[unit.on_path]]
path = "fights"
topic = "Written consent and notice"
entity = "corporation"
cite = "228(a), (c), (e), 141(f), 229"
url = "https://delcode.delaware.gov/title8/c001/sc07/index.html"
governs = "Holders of the needed votes may act by consent with no prior notice or meeting, within 60 days; prompt notice goes to others afterward. A board can be replaced with no warning. Board consent must be unanimous."

[[unit.on_path]]
path = "fights"
topic = "Records access"
entity = "corporation"
cite = "220"
url = "https://delcode.delaware.gov/title8/c001/sc07/index.html"
governs = "Sworn demand, good faith, proper purpose, particularity. Books and records is now a defined list, including 3 years of minutes and communications to stockholders. Narrowed in 2025."

[[unit.on_path]]
path = "fights"
topic = "Duties and how an agreement can change them"
entity = "corporation"
cite = "102(b)(7), 122(17), 144"
url = "https://delcode.delaware.gov/title8/c001/sc04/index.html"
governs = "The charter may limit money liability for care breaches, officers included, though not for claims by or for the corporation against officers. Corporate opportunities can be renounced. Safe harbours for interested and controller transactions, rewritten in 2025. The rest of the duty law is judge-made."

[[unit.on_path]]
path = "fights"
topic = "Indemnification and advancement"
entity = "corporation"
cite = "145(a)-(g), (k)"
url = "https://delcode.delaware.gov/title8/c001/sc04/index.html"
governs = "Power to indemnify on a good faith standard; mandatory for present or former directors and officers who succeed. Advancement is permissive unless a bylaw or agreement makes it mandatory."

[[unit.on_path]]
path = "fights"
topic = "Deadlock, dissolution and exit"
entity = "corporation"
cite = "273, 226"
url = "https://delcode.delaware.gov/title8/c001/sc10/index.html"
governs = "Two 50% holders in a joint venture may petition to dissolve; the custodian route covers other deadlock."

[[unit.on_path]]
path = "fights"
topic = "Voting and transfer agreements"
entity = "corporation"
cite = "218(c), 122(18), 212(e), 202, 262"
url = "https://delcode.delaware.gov/title8/c001/sc07/index.html"
governs = "Signed voting agreements, stockholder contracts with approval rights, irrevocable proxies, transfer restrictions (202(c)(4) is the closest basis for a drag-along) and appraisal."

[[unit.on_path]]
path = "fights"
topic = "Forum and governing law"
entity = "corporation"
cite = "115"
url = "https://delcode.delaware.gov/title8/c001/sc01/index.html"
governs = "Charter or bylaws may require internal corporate claims in Delaware courts and may not bar them from Delaware."

