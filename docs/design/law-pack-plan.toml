[[unit.on_path]]
path = "fights"
topic = "Preservation and taking documents"
entity = "both"
cite = "Fed. R. Civ. P. 37(e)"
need = "court-rules.us-lost-esi"
governs = "The rule covers ESI \"that should have been preserved in the anticipation or conduct of litigation\" and is lost through a failure to take reasonable steps, when it can't be restored or replaced. On prejudice, the court may order \"measures no greater than necessary to cure the prejudice\" (37(e)(1)). It may \"presume that the lost information was unfavorable to the party\", instruct the jury so, or dismiss or enter a default \"only upon finding that the party acted with the intent to deprive another party of the information's use in the litigation\" (37(e)(2))."

[[unit.on_path]]
path = "fights"
topic = "Procedure in federal court"
entity = "both"
cite = "Fed. R. Civ. P. 1 to 87"
governs = "How a case runs in federal court, from complaint through discovery to judgment."

[[unit.on_path]]
path = "fights"
topic = "Federal discovery scope and production form"
entity = "both"
cite = "Fed. R. Civ. P. 26(b)(1), 26(b)(2)(B), 34(b)(2)(A), 34(b)(2)(E), 45(d)(2)(B)"
need = "court-rules.us-discovery"
governs = "Discovery reaches \"any nonprivileged matter that is relevant to any party's claim or defense and proportional to the needs of the case\" (26(b)(1)). Electronic sources \"not reasonably accessible because of undue burden or cost\" need a showing of good cause (26(b)(2)(B)). Responses are due \"within 30 days after being served\" (34(b)(2)(A)). With no form requested, electronic records come \"in a form or forms in which it is ordinarily maintained or in a reasonably usable form or forms\", and only once (34(b)(2)(E)). A subpoena objection is due \"before the earlier of the time specified for compliance or 14 days after the subpoena is served\" (45(d)(2)(B))."

[[unit.on_path]]
path = "fights"
topic = "Federal privilege log and clawback"
entity = "both"
cite = "Fed. R. Civ. P. 16(b)(3)(B)(iv), 26(b)(5)(A), 26(b)(5)(B), 26(f)(3)(D), 45(e)(2)"
need = "court-rules.us-privilege-log"
governs = "A party withholding privileged material must \"expressly make the claim\" and describe what it withholds so others can assess it (26(b)(5)(A)). After notice of a produced privileged item, the receiver \"must promptly return, sequester, or destroy\" it and not use it until the claim is resolved (26(b)(5)(B)). Since December 1, 2025, the discovery plan and scheduling order cover \"the timing and method for complying with Rule 26(b)(5)(A)\" (26(f)(3)(D), 16(b)(3)(B)(iv)). Rule 45(e)(2) applies the same to subpoenas."

