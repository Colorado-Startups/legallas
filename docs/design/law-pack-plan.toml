[[unit.on_path]]
path = "startup-forms"
cite = "1052(d)"
need = "intellectual-property-law.trademark-clearance"
governs = "Registration is refused for a mark that so resembles a registered mark, or one already used and not abandoned, \"as to be likely, when used on or in connection with the goods of the applicant, to cause confusion\". A clearance search looks for those marks."

[[unit.on_path]]
path = "startup-forms"
cite = "1062(b)(2)-(3)"
need = "intellectual-property-law.trademark-office-action"
governs = "After a refusal the applicant has \"a period of 6 months in which to reply or amend the application, or such shorter time that is not less than 60 days\", as the Director sets. Extensions may aggregate 6 months from the notice. A missed reply abandons the application unless the delay was unintentional."

[[unit.on_path]]
path = "startup-forms"
cite = "1058(a), 1059(a)"
need = "intellectual-property-law.trademark-maintenance"
governs = "A registration is canceled unless its owner files an affidavit \"Within the 1-year period immediately preceding the expiration of 6 years following the date of registration\", and again before each 10-year mark, or \"within the 6-month grace period\" after. Renewal is filed \"within 1 year before the end of each successive 10-year period\", or within \"a grace period of 6 months\" with a surcharge."

