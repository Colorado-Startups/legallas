[[unit.on_path]]
path = "startup-forms"
cite = "8-2-113(2), (3)(c), (4)"
governs = "Non-competes are void except for highly compensated workers protecting trade secrets. A separate signed notice is required. A new hire gets it \"before the worker accepts the employer's offer of employment\". A current worker gets it \"at least fourteen days before the earlier of\" the covenant's effective date and that of the pay or terms given for it. Founder and early staff equity papers must allow for it. Quotes read 2026-11-13."

