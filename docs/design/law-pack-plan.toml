[[unit]]
id = "d-colo-local-rules"
title = "Local Rules of Practice of the United States District Court for the District of Colorado"
citation = "D.C.COLO.LCivR 26.1, 30.1 to 30.3, 37.1, 45.1"
level = "federal"
layer = "other"
first_path = "fights"
