governs = "Annual report and franchise tax due March 1. Lesser of two methods: authorized shares, from $175, or assumed par value capital. Maximum $200,000, or $250,000 for a large filer. Penalty $200 and 1.5% a month."

[[unit]]
id = "de-llc-act"
