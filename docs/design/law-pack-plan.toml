url = "https://uscode.house.gov/us/usc/t15/s77d/"
governs = "Founder stock is a security. Exempt if the issuer's transaction involves no public offering, with no dollar limit and no definition in the statute. Anti-fraud applies anyway."

[[unit.on_path]]
path = "startup-raises"
cite = "4(a)(2), 4(a)(5), 4(a)(6), 4A, 4(a)(7), 3(b)(2), 12(a)(1), 17(a), 18(b)(4), 18(c)"
url = "https://uscode.house.gov/us/usc/t15/s77r/"
governs = "Exemptions for private, accredited-only, crowdfunded and Regulation A sales, and private resales. Buyer's remedy when an exemption fails. Preemption: states can't require registration of Rule 506 and other covered securities, and keep fraud enforcement, notice filings and fees."

[[unit.on_path]]
path = "angels-create-groups"
cite = "4(b), 4(c) (15 U.S.C. 77d(b), (c))"
url = "https://uscode.house.gov/us/usc/t15/s77d/"
governs = "No broker registration solely for running a Rule 506 platform or mechanism, co-investing, or giving due diligence and standard documents, if there's no pay tied to the sale, no holding of funds or securities, and no disqualification. It came from JOBS Act 201(c) and now sits at 77d(c). It doesn't lift state requirements."

[[unit]]
id = "us-sec-part-230"
title = "SEC General Rules under the Securities Act, including Regulation D, Regulation A, Rules 144, 147, 148, 152, 241 and 701, and Regulation S"
citation = "17 CFR Part 230"
level = "federal"
layer = "securities"
first_path = "startup-forms"
paths = ["startup-forms", "startup-raises", "angels-invest", "angels-create-groups", "vcs-invest"]
