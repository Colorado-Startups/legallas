url = "https://uscode.house.gov/us/usc/t18/s1519/"
need = "court-rules.us-obstruction"
governs = "It's a crime to knowingly alter, destroy or falsify a record \"with the intent to impede, obstruct, or influence\" a federal matter, \"or in relation to or contemplation of any such matter or case\", so no case need be open yet; the penalty is a fine or \"imprisoned not more than 20 years\", or both (1519). Corruptly destroying or concealing a record to impair its use in an official proceeding carries the same 20 years (1512(c)(1)), and the proceeding \"need not be pending or about to be instituted at the time of the offense\" (1512(f)(1))."

