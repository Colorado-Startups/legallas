[[unit.on_path]]
path = "startup-forms"
cite = "8-4-101(6), 8-4-103(1), (4), (4.5), 8-4-109(1)"
governs = "A first hire: pay periods no longer than a calendar month or thirty days, whichever is longer, paid \"on regular paydays no later than ten days following the close of each pay period\". An itemized pay statement each payday, kept three years. Final pay on discharge is \"due and payable immediately\". An individual owning or controlling at least 25% can be the employer. C.R.S. 2026, read 2026-11-06; quotes read 2026-11-13."

[[unit.on_path]]
path = "fights"
topic = "Wage claims"
entity = "both"
cite = "8-4-101(5), (6), (14), 8-4-109, -111, -120, -121, -122"
governs = "Employer now includes an individual owning or controlling at least 25%, except a minority owner showing full delegation of day-to-day control. Final pay is due at once on discharge. Penalties if not paid \"within fourteen days after a written demand is sent\" (read 2026-11-13). Division takes claims up to $13,000. Waivers are void. Suit within 2 years, 3 if willful. Adverse action within 90 days of protected activity may alone suffice to show retaliation."

