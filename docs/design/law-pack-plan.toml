[[unit.on_path]]
path = "startup-forms"
cite = "1.83-2(b), 1.1362-6(a)(2)(ii)(A), 301.7701-3(c)(1)(iii), 1.6072-2(a)(1), 301.6109-1(h)"
governs = "An 83(b) election \"shall be filed not later than 30 days after the date the property was transferred\". An S election counts for this year if \"made before the 16th day of the third month of the year\". An entity election's effective date \"can not be more than 75 days prior to the date on which the election is filed\". A C corporation files \"on or before the fifteenth day of the fourth month following the close of the taxable year\". An entity keeps its EIN when its classification changes."

[[unit.on_path]]
