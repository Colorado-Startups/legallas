[[unit]]
id = "de-chancery-rules"
title = "Court of Chancery rules and guidelines on preservation, production, subpoenas and privilege logs"
citation = "Ct. Ch. R. 34, 37(e), 45; Guidelines for Preservation of ESI; Guidelines for Persons Litigating in the Court of Chancery"
level = "Delaware"
layer = "other"
first_path = "fights"
paths = ["fights"]
take = "cite-only"
ship = "cite-only"
host = "delaware-courts"
official_url = "https://courts.delaware.gov/forms/download.aspx?id=160908"
fetch_url = "https://courts.delaware.gov/forms/download.aspx?id=160908"
format = "PDF: the rules, and two guideline PDFs"
as_of = "Rules as amended effective 2026-06-01, opened 2026-11-13"
status = "VERIFIED"
note = "Rules 34, 37(e) and 45 read in the rules PDF on 2026-11-13. Guidelines for Preservation of ESI: https://courts.delaware.gov/forms/download.aspx?id=50988. Guidelines for Persons Litigating in the Court of Chancery: https://courts.delaware.gov/forms/download.aspx?id=99468, its file name dated 11.15.24. The courts' terms, re-read 2026-11-13, reserve all rights, so all three are cited, never stored."

[[unit.on_path]]
path = "fights"
topic = "Preservation and taking documents"
entity = "both"
cite = "Ct. Ch. R. 37(e); Guidelines for Preservation of ESI"
need = "court-rules.de-lost-esi"
governs = "The duty can arise once litigation is reasonably anticipated, before filing. When lost ESI can't be restored, the court may order \"measures no greater than necessary to cure the prejudice\". It may presume the lost information unfavorable, or dismiss or enter a default, \"only upon finding that the party acted recklessly or with the intent to deprive another party of the information's use in the litigation\" (37(e)(2)). The federal rule needs intent; Chancery also reaches recklessness. Counsel oversees a hold; laptops, home computers and USB drives are flagged."

[[unit.on_path]]
path = "fights"
topic = "Chancery discovery and subpoenas"
entity = "both"
cite = "Ct. Ch. R. 34(b), 34(d), 45(c)(2)(B), 45(d)(2)"
need = "court-rules.de-discovery"
governs = "A written response to a document request is due \"within 30 days after the service of the request\", but a defendant may respond \"within 45 days after service of the summons and complaint\" (34(b)). With no form requested, ESI comes \"in a form or forms in which it is ordinarily maintained or in which it is reasonably usable\", and only once (34(d)). A subpoenaed person may object in writing \"within 14 days after service of the subpoena or before the time specified for compliance if such time is less than 14 days after service\" (45(c)(2)(B)). Withheld privileged material is claimed expressly, with a description that lets the other side contest it (45(d)(2))."

[[unit.on_path]]
path = "fights"
topic = "Chancery privilege logs"
entity = "both"
cite = "Guidelines for Persons Litigating in the Court of Chancery, part on privilege logs"
url = "https://courts.delaware.gov/forms/download.aspx?id=99468"
need = "court-rules.de-privilege-log"
governs = "Guidelines, not rules. The senior lawyers, especially senior Delaware lawyers, are responsible for the privilege review: no systematic overdesignation, and log descriptions that let the other side and the court assess each claim. The court generally doesn't expect post-litigation communications to be logged, so the filing date can serve as a cutoff. Parties may agree to log some kinds of documents by category, and to settle how email chains and attachments are logged."

