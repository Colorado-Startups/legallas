fetch_url = "https://olls.info/crs/crs2026-title-08.docx"
format = "Word, the whole of title 8"
as_of = "C.R.S. 2026; neither section has a 2025 or 2026 source note"
status = "VERIFIED"
note = "Both sections read in full in the 2026 file on 2026-11-13. Only these two sections are stored. co-unemployment holds the premiums (8-76) and co-unemployment-employer who is an employer (8-70-113)."

[[unit.on_path]]
path = "startup-forms"
cite = "8-70-115(1)(b)-(d), (2)"
need = "employment-law.contractor-test-colorado"
governs = "Service for pay is employment unless the worker \"is free from control and direction in the performance of the service, both under his contract for the performance of service and in fact; and such individual is customarily engaged in an independent trade, occupation, profession, or business related to the service performed\". A document signed by both can show the business does not do nine things, among them require exclusive work, pay a salary or hourly rate, or provide tools or benefits. It creates a rebuttable presumption of a contractor when it says, in larger, bold or underlined type, that the contractor gets no unemployment benefits and pays their own income tax."

[[unit.on_path]]
path = "fights"
topic = "Wage claims"
entity = "both"
cite = "8-72-114(3)(e), (4), (5)"
need = "employment-law.misclassification-fines"
governs = "On a finding of misclassification, the division orders back premiums and interest. With willful disregard it may impose \"a fine of up to five thousand dollars per misclassified employee for the first misclassification with willful disregard, and for a second or subsequent misclassification with willful disregard, a fine of up to twenty-five thousand dollars per misclassified employee\". A second willful finding can also bar state contracts for up to two years. An employer may ask the director for an advisory opinion, and posts the division's misclassification notice."

