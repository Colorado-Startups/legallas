# The people eval (#785): the person guard's set, web/scripts/ask-eval.people.json (invented questions about the
# fictional room), through Ask's replica on the live sample room (quality-speed/pages/data-room/live/README.md), then
# the people gate (web/scripts/ask-eval-gate.ts --people). Started by hand on main, once per RECOMMEND value and shard:
#
#   gh workflow run people-eval.yml -R Colorado-Startups/legallas --ref main -f recommend=0 -f shard=1/3
#
# Launch readiness `people_guard` takes #785 as evidence once every item passes under both RECOMMEND values. Runs may
# span commits: the closing PR lists what changed in web/worker/ between them.
#
# | Input | Why |
# |---|---|
# | Model, settings | The example's (web/wrangler.example.jsonc), which the sample room deploys (data-room/live/settings.ts) |
# | `recommend` | The guard must hold with a recommendation off (the example) and on |
# | `shard` | An answer costs about 450 neurons (ask-replica.ts TYPICAL_ANSWER_NEURONS) plus one output ceiling, about 1,120, for the last answer's hold; 17 items do not fit the 7,000 a day scripts may use. k/n, n up to 9 |
#
# Spend: the replica's spend lease counts in the sample room's D1, so it stops at the scripts' share of the day's free
# Workers AI neurons, and --preflight refuses a shard the day cannot finish. Run a refused one again after 00:00 UTC.
#
# Token: LIVE_ROOM_CLOUDFLARE_TOKEN, the quality-speed environment's. Beside Workers AI Read and D1 Edit, the replica's
# retrieval needs AI Search Read and AI Search Run.
#
# The log and summary get only the gate's output, as in replica-eval.yml: the replica is the tool a customer room's
# eval runs too, so its output stays in the job's temp folder whatever the set.
name: People eval

on:
  workflow_dispatch:
    inputs:
      recommend:
        description: RECOMMEND as Ask would run it (0, the example's, or 1)
        type: choice
        options: ['0', '1']
        default: '0'
      shard:
        description: Run the k-th of n shards of the set (k/n)
        type: string
        required: false
        default: '1/3'

permissions: {}

# One at a time: they share the day's neurons. A second run waits.
concurrency:
  group: people-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: quality-speed
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: web
    steps:
      - name: On main, with the environment set
        working-directory: .
        env:
          REF: ${{ github.ref }}
          SHARD: ${{ inputs.shard }}
          # Whether the token is set: a word, never the token.
          TOKEN_SET: ${{ secrets.LIVE_ROOM_CLOUDFLARE_TOKEN != '' }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error title=People eval::run this workflow on main, not $REF"; exit 1
          fi
          if [[ ! "$SHARD" =~ ^([1-9])/([1-9])$ ]] || (( BASH_REMATCH[1] > BASH_REMATCH[2] )); then
            echo "::error title=People eval::shard must be k/n with 1 <= k <= n <= 9"; exit 1
          fi
          if [[ "$TOKEN_SET" != true || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error title=People eval::LIVE_ROOM_CLOUDFLARE_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) must be set on the quality-speed environment"; exit 1
          fi
          eval_dir="$RUNNER_TEMP/people-eval"
          (umask 077 && mkdir -p "$eval_dir/out" "$eval_dir/tmp" "$eval_dir/wrangler-logs")
          {
            echo "EVAL_DIR=$eval_dir"
            echo "WRANGLER_LOG_PATH=$eval_dir/wrangler-logs"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ask's model as the sample room runs it
        id: model
        run: |
          # A room config would make this a customer room's eval, with its own paid month.
          if [[ -e legallas.config.json || -e room.config.json || -e wrangler.jsonc ]]; then
            echo "::error title=People eval::a room's settings are checked in"; exit 1
          fi
          model="$(sed -n 's/^ *"LEGALLAS_MODEL": *"\(@cf\/[^"]*\)".*/\1/p' wrangler.example.jsonc | head -n 1)"
          if [[ -z "$model" ]]; then
            echo "::error title=People eval::no LEGALLAS_MODEL in web/wrangler.example.jsonc"; exit 1
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # No install scripts, and before any key is in reach.
      - name: Install
        run: npm ci --ignore-scripts
      - name: Replica eval
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LIVE_ROOM_CLOUDFLARE_TOKEN }}
          MODEL: ${{ steps.model.outputs.model }}
          RECOMMEND: ${{ inputs.recommend }}
          SHARD: ${{ inputs.shard }}
        run: |
          umask 077
          export TMPDIR="$EVAL_DIR/tmp"
          args=(--model "$MODEL" --concurrency 3 --reps 1 --preflight --recommend "$RECOMMEND")
          if [[ "$SHARD" != 1/1 ]]; then args+=(--shard "$SHARD"); fi
          npm run eval:ask-replica -- "${args[@]}" --set scripts/ask-eval.people.json --out "$EVAL_DIR/out" > "$EVAL_DIR/replica.log" 2>&1
      # Reads the report even when the run stopped part way: a partial report is incomplete, never a pass.
      - name: People gate
        if: always() && steps.model.outcome == 'success'
        env:
          MODEL: ${{ steps.model.outputs.model }}
          RECOMMEND: ${{ inputs.recommend }}
          SHARD: ${{ inputs.shard }}
        run: |
          status=0
          node scripts/ask-eval-gate.ts "$EVAL_DIR/out" --people --log "$EVAL_DIR/replica.log" > "$EVAL_DIR/gate.md" 2> "$EVAL_DIR/gate.err" || status=$?
          if [[ ! -s "$EVAL_DIR/gate.md" ]]; then
            printf '### People gate: INCOMPLETE\n\nThe gate script failed before printing; its error output stays on the runner.\n' > "$EVAL_DIR/gate.md"
            [[ "$status" -ne 0 ]] || status=2
          fi
          {
            cat "$EVAL_DIR/gate.md"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Model: $MODEL; RECOMMEND: $RECOMMEND; shard: $SHARD"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$EVAL_DIR/gate.md"
          exit "$status"
