# Software bill of materials (CycloneDX JSON) for the room and MCP Workers and the Mac app, by hand and on a release tag.
# .github/scripts/sbom.ts builds it from web/package-lock.json and any tracked Package.resolved, with no install, and
# prints each file's component count; the run keeps the three files as an artifact. A pull request runs it only when
# this workflow or its script changes.
#
#   gh workflow run sbom.yml -R Colorado-Startups/legallas
#
# GitHub-hosted ubuntu-slim: the job takes seconds and holds no secret, and Linux 1-core bills at a third of 2-core.
# Not Blacksmith: build_minutes_guard.py counts only ci.yml and quality-speed.yml there, and keeps it off for now.
name: SBOM

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/sbom.yml
      - .github/scripts/sbom.ts

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Nothing is installed, and a tag's SBOM must never read a cache a pull request could have written.
          package-manager-cache: false
      - name: Build the SBOM
        run: node .github/scripts/sbom.ts "$RUNNER_TEMP/sbom"
      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error
