# Proves the confinement that .github/scripts/claude-settings.sh gives Claude in
# claude.yml: runs claude-confinement-check.sh (one short Haiku session, agent
# mode) with a real Claude Code, signed in
# through the CLAUDE_CODE_OAUTH_TOKEN Actions secret. Run it by hand after any
# change to claude-settings.sh or to the claude-code-action pin (which sets the
# Claude Code version), on the branch that makes the change:
#
#   gh workflow run claude-confinement.yml --ref <branch>
#
# Add -f runner=ubuntu-26.04 to try a newer GitHub-hosted image before
# claude.yml moves to it (#794). The monthly run uses ubuntu-24.04, as claude.yml.
#
# It tests the branch's own scripts, not main's, because the point is to prove
# a change before it merges. It also runs on main on the 1st of each month: the
# runner image and the Claude Code sign-in change under an unchanged fence, and
# the Quality and Speed site's Agents page counts the fence as proven only for
# 35 days after a passing run. It installs the Claude Code version claude.yml
# gets: the one the claude-code-action commit it pins installs, read from that
# commit's source, so a Dependabot bump of the action moves it too.
#
# GitHub-hosted on purpose, not vars.CI_RUNNER, like claude.yml: the
# agent mode needs bubblewrap and its user namespaces, which container
# runners cannot provide. It runs
# under the same conditions as claude.yml: a private HOME and Claude
# config folder in the job's temp folder, bubblewrap and socat installed, and
# Ubuntu's AppArmor limit on unprivileged user namespaces lifted (the VM
# serves one job and is then thrown away).
name: Claude confinement check

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted image
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-26.04
  schedule:
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: claude-confinement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confinement:
    if: vars.CLAUDE_ENABLED == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Private HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home/.claude"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/home/.claude"
            echo "GIT_TERMINAL_PROMPT=0"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # claude.yml must pin one claude-code-action commit; its
      # src/entrypoints/run.ts names the Claude Code version it installs.
      - name: Claude Code version claude.yml pins
        id: pin
        run: |
          set -o pipefail
          shas="$(grep -ho 'anthropics/claude-code-action@[0-9a-f]\{40\}' .github/workflows/claude.yml | sort -u)"
          if [ -z "$shas" ] || [ "$(printf '%s\n' "$shas" | wc -l)" -ne 1 ]; then
            echo "::error::claude.yml must pin one claude-code-action commit; found: ${shas:-none}"
            exit 1
          fi
          sha="${shas##*@}"
          version="$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/anthropics/claude-code-action/$sha/src/entrypoints/run.ts" \
            | sed -n 's/.*claudeCodeVersion = "\([0-9][0-9.]*\)".*/\1/p' | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no claudeCodeVersion in claude-code-action $sha (src/entrypoints/run.ts); update this step"
            exit 1
          fi
          echo "claude-code-action $sha installs Claude Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The same version the action uses, into the private HOME: that version's binary, checked against its release
      # manifest, whose signature is checked against Anthropic's pinned release key, then told to install itself. The action's installer script does the same, but it can change at any time.
      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -o pipefail
          .github/scripts/claude-release-fetch.sh "$CLAUDE_CODE_VERSION" linux-x64 "$RUNNER_TEMP/claude-binary"
          chmod +x "$RUNNER_TEMP/claude-binary"
          "$RUNNER_TEMP/claude-binary" install "$CLAUDE_CODE_VERSION"
          rm -f "$RUNNER_TEMP/claude-binary"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version | grep -F "$CLAUDE_CODE_VERSION"
      # As in claude.yml: the agent mode's sandbox is bubblewrap, with socat
      # for its network proxy. The probe proves bubblewrap runs a command.
      - name: Sandbox prerequisites
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Ubuntu 26.04 also ships an AppArmor profile for bwrap itself (its
          # apparmor package; 24.04's lacks it). Unloaded for the same reason (#794).
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          # A real command, not only `true`: a shell in the full sandbox writes
          # a file to its own /tmp and reads it back.
          if ! probe="$(bwrap --new-session --die-with-parent --unshare-all --ro-bind / / \
              --dev /dev --proc /proc --tmpfs /tmp \
              sh -c 'echo bwrap-ok > /tmp/probe && cat /tmp/probe')" || [ "$probe" != bwrap-ok ]; then
            echo "::error::bubblewrap ran no command (output: ${probe:-none})"
            sudo journalctl -k --no-pager | grep -i apparmor | tail -n 50 || true
            exit 1
          fi
      # As the action does: the confinement goes into the user settings.
      - name: Confinement check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_SETTINGS_AS_USER: "1"
        run: bash .github/scripts/claude-confinement-check.sh
