name: Bug
description: Something in Legallas doesn't work as expected.
labels: [bug]
type: Bug
body:
  - type: textarea
    id: triage
    attributes:
      label: Severity and where it landed
      description: "Severity: critical, high, medium or low. Landed: the commit that brought the bug. One per line: the Reliability page reads them."
      value: |
        Severity: high
        Landed:
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [The room (web), Mac app, MCP server, Swift package, "Legal content (law, templates, checklist)", Docs, CI or tooling]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Never paste case documents, party names or anything from the matter.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: who
    attributes:
      label: Who it's for
      description: Who meets it, such as founders, counsel, investors or a session.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to work
      description: Files or folders to change, as far as you know.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it's fixed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
