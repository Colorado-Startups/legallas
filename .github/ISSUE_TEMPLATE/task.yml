name: Quick fix
description: A small fix, chore or cleanup with a clear scope. Features and improvements start in Discussions.
type: Task
body:
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who it's for
      description: Who it serves, such as founders, counsel, investors or a session.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to work
      description: Files or folders to change, as far as you know.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it's finished.
    validations:
      required: true
