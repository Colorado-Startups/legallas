<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Doe v. Harbor Labs, Inc.: share flow</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
.wp { font-size: 12px; color: #991b1b; padding: 4px 24px; }
.band { background: #0f172a; padding: 20px 24px; display: flex; gap: 32px; }
.stat-num { color: #ffffff; font-size: 28px; font-weight: 700; }
.stat-cap { color: #94a3b8; font-size: 12px; }
.flow { display: flex; gap: 12px; padding: 24px; align-items: center; }
.node { padding: 10px 14px; border-radius: 8px; font-weight: 600; color: #ffffff; background: #475569; }
.node.client { background: #15803d; color: #ffffff; }
.node.defendant { background: #b91c1c; color: #ffffff; }
.chip { background: #0d9488; color: #ffffff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.icon { background: #7c3aed; color: #ffffff; width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center; }
.arrow { color: #64748b; }
</style></head>
<body>
<div class="wp">Attorney work product</div>
<div class="band">
  <div><div class="stat-num">$2,683.55</div><div class="stat-cap">Repurchase price at cost</div></div>
  <div><div class="stat-num">$18,462.90</div><div class="stat-cap">Final wages left unpaid</div></div>
</div>
<div class="flow">
  <div class="node client">Doe's unvested shares</div><span class="arrow">&rarr;</span>
  <div class="node">Repurchased at cost</div><span class="arrow">&rarr;</span>
  <div class="node defendant">Cancelled by Harbor Labs</div>
  <span class="chip">DOE-000037</span><span class="icon">i</span>
</div>
</body></html>
