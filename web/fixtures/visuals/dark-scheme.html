<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Doe v. Harbor Labs, Inc.: repurchase summary</title>
<style>
:root { --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #1e3a5f; --good: #15803d; --mint: #ecfdf5; --radius: 10px; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b1220; --card: #111827; --ink: #e5e7eb; --muted: #94a3b8; --line: #1f2937; --accent: #93c5fd; --good: #4ade80; --mint: #052e1b; --radius: 12px; }
  .stat .num { color: #f8fafc; text-shadow: 0 1px 0 #000; letter-spacing: -0.01em; }
  img { filter: invert(1); opacity: 0.9; }
}
:root[data-theme="dark"] { --bg: #0b1220; --card: #111827; --ink: #e5e7eb; --muted: #94a3b8; --mint: #052e1b; }
[data-theme="dark"] .card { background: #111827; border-color: #1f2937; }
body { margin: 0; font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
.wp { background: #fef2f2; color: #991b1b; padding: 6px 16px; font-size: 12px; }
main { padding: 24px; display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); }
h1 { grid-column: 1 / -1; font-family: Georgia, serif; font-weight: 600; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stat .num { font-size: 32px; font-weight: 700; color: var(--accent); }
.stat .label { color: var(--muted); font-size: 13px; }
.stat.good { background: var(--mint); }
.stat.good .num { color: var(--good); }
</style></head>
<body>
<div class="wp">Attorney work product | Privileged and confidential</div>
<main>
<h1>The repurchase notice Harbor Labs served on Doe</h1>
<div class="card stat"><div class="num">$2,683.55</div><div class="label">Price at cost in June 2012 (DOE-000036 to DOE-000039)</div></div>
<div class="card stat good"><div class="num">214,684</div><div class="label">Unvested shares</div></div>
<div class="card stat"><div class="num">3</div><div class="label">Board meetings logged</div></div>
</main>
</body></html>
